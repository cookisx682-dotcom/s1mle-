<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mechatronika: rozober a zlož procesor v 3D a vyrob vlastný mikročip.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Mechatronika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D workbench; glass toolbar on top, AI guide card on the right (bottom sheet on phones), action dock at the bottom */
:root{
  --bg:#EDF0F3; --bg2:#D9E0E7; --panel:rgba(255,255,255,.84); --panel-solid:#FFFFFF;
  --ink:#12171C; --muted:#5A6571; --line:rgba(18,28,38,.12);
  --accent:#B05C28; --accent-soft:rgba(176,92,40,.12); --accent-ink:#FFFFFF;
  --ok:#25804E; --ok-soft:rgba(37,128,78,.12); --err:#C13F36; --err-soft:rgba(193,63,54,.11);
  --grid:#AAB4BF;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 12px 32px rgba(18,28,38,.10),0 1px 2px rgba(18,28,38,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171B; --bg2:#0A0D10; --panel:rgba(22,28,33,.86); --panel-solid:#161C21;
  --ink:#E6EBEF; --muted:#8D99A5; --line:rgba(225,235,245,.10);
  --accent:#E28A4E; --accent-soft:rgba(226,138,78,.15); --accent-ink:#1A0E06;
  --ok:#53C285; --ok-soft:rgba(83,194,133,.14); --err:#F06C60; --err-soft:rgba(240,108,96,.14);
  --grid:#2C353D; --shadow:0 12px 32px rgba(0,0,0,.40),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171B; --bg2:#0A0D10; --panel:rgba(22,28,33,.86); --panel-solid:#161C21;
  --ink:#E6EBEF; --muted:#8D99A5; --line:rgba(225,235,245,.10);
  --accent:#E28A4E; --accent-soft:rgba(226,138,78,.15); --accent-ink:#1A0E06;
  --ok:#53C285; --ok-soft:rgba(83,194,133,.14); --err:#F06C60; --err-soft:rgba(240,108,96,.14);
  --grid:#2C353D; --shadow:0 12px 32px rgba(0,0,0,.40),0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 45% 30%,var(--bg) 0%,var(--bg2) 100%);background-color:var(--bg);color:var(--ink);font-family:var(--f-sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px}
.brand svg{flex:none}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;padding:4px;gap:4px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}
.models{display:flex;gap:6px;padding:4px;overflow-x:auto;max-width:100%}
.model{border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted);display:flex;gap:6px;align-items:center}
.model.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.model .soon{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.spacer{flex:1}

/* AI guide */
.guide{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);right:max(16px,env(safe-area-inset-right,0px));width:348px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;z-index:4;overflow:hidden}
.g-head{display:flex;gap:10px;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.ai-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#6A7BD8);color:#fff;font:600 11px var(--f-mono);letter-spacing:.04em;flex:none;position:relative}
.ai-dot::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--panel-solid)}
.g-head b{font-size:14px;display:block}
.g-head span{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;min-height:0}
.msg{background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;animation:pop .28s ease-out both}
.msg.old{opacity:.62}
.msg h4{margin:0 0 4px;font-size:14px;font-weight:600;text-wrap:balance;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg p{margin:0}
.msg p+p{margin-top:6px}
.msg .fact{color:var(--muted);font-size:12.5px}
.msg .fact b{color:var(--ink);font-weight:600}
.pill{font:600 10px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.msg.err{border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.msg.err .pill{background:var(--err-soft);color:var(--err)}
.msg.ok .pill{background:var(--ok-soft);color:var(--ok)}
.msg .tag{font:500 11px var(--f-mono);color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* dock */
.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 364px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none}
.dock>*{pointer-events:auto}
.bar{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-solid);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat{display:flex;flex-direction:column;padding:0 10px;min-width:0}
.stat small{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.meter{width:110px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.hint{font-size:12px;color:var(--muted);padding:0 8px}
.hint kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel-solid)}

/* fab steps */
.steps{display:flex;gap:8px;overflow-x:auto;padding:8px;scrollbar-width:thin}
.step{flex:none;width:158px;text-align:left;border:1px solid var(--line);background:var(--panel-solid);border-radius:11px;padding:10px 12px;cursor:pointer;transition:transform .12s,border-color .15s}
.step:hover{transform:translateY(-2px);border-color:var(--accent)}
.step small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.03em;margin-bottom:3px}
.step b{font-size:13px;font-weight:600;line-height:1.3;display:block}
.step.bad{animation:shake .4s;border-color:var(--err)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.done-row{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;align-items:center;font-size:12px}
.chip{font:500 11px var(--f-mono);padding:4px 8px;border-radius:7px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.chip.next{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.tip{position:fixed;z-index:9;pointer-events:none;padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600;transform:translate(14px,14px);white-space:nowrap}
.tip small{display:block;font:500 10.5px var(--f-mono);color:var(--muted);font-weight:500}
.temp-hot b{color:var(--err)}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;z-index:20;background:var(--bg)}

@media (max-width:860px){
  .guide{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px + var(--dockH,64px) + 8px);max-height:30vh}
  .g-head{padding:10px 12px}
  .g-head span{display:none}
  .dock{right:max(16px,env(safe-area-inset-right,0px))}
  .models{order:3;width:100%}
  .brand small{display:none}
  .hint{display:none}
  .meter{width:70px}
}
@media (prefers-reduced-motion:reduce){.msg,.step.bad{animation:none}.btn,.step{transition:none}}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="3D pracovisko"></canvas>
<div class="loading" id="loading">Načítavam laboratórium…</div>

<header class="top">
  <div class="brand glass">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="6" y="6" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10.5" y="10.5" width="7" height="7" rx="1.2" fill="var(--accent)"/><path d="M10 2v4M14 2v4M18 2v4M10 22v4M14 22v4M18 22v4M2 10h4M2 14h4M2 18h4M22 10h4M22 14h4M22 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div><b>Mechatronika</b><small>Laboratórium · 3D</small></div>
  </div>
  <div class="tabs glass" role="tablist">
    <button class="tab" role="tab" id="tab-shop" aria-selected="true">Dielňa</button>
    <button class="tab" role="tab" id="tab-fab" aria-selected="false">Výroba čipu</button>
  </div>
  <div class="models glass" id="models">
    <button class="model on" data-m="chip">Mikročip</button>
    <button class="model" data-m="engine">Motor auta <span class="soon">čoskoro</span></button>
    <button class="model" data-m="emotor">Elektromotor <span class="soon">čoskoro</span></button>
    <button class="model" data-m="arm">Robotické rameno <span class="soon">čoskoro</span></button>
  </div>
</header>

<aside class="guide glass" aria-live="polite">
  <div class="g-head">
    <div class="ai-dot">AI</div>
    <div><b>AI sprievodca</b><span>Klikni na diel a vysvetlím ti ho</span></div>
  </div>
  <div class="msgs" id="msgs"></div>
</aside>

<div class="dock" id="dock">
  <div id="shopDock" class="bar glass">
    <div class="stat"><small>Rozobraté</small><b id="sProg">0 / 10</b><div class="meter"><i id="sMeter"></i></div></div>
    <div class="stat" id="tempBox"><small>Teplota</small><b id="sTemp">– °C</b></div>
    <div class="stat"><small>Chyby</small><b id="sErr">0</b></div>
    <div class="sep"></div>
    <button class="btn" id="bExplode" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h10M3 8h10M3 12h10"/><path d="M8 1v2M8 13v2"/></svg>Rozložiť 3D</button>
    <button class="btn" id="bCut" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M8 1v14"/></svg>Rez</button>
    <button class="btn primary" id="bPower"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v6"/><path d="M4.4 4.6a5 5 0 1 0 7.2 0"/></svg>Zapnúť</button>
    <button class="btn" id="bReset">Reset</button>
    <span class="hint"><kbd>ťahaj</kbd> diel = vyber / vlož · <kbd>klik</kbd> = popis</span>
  </div>
  <div id="fabDock" hidden>
    <div class="glass" style="margin-bottom:8px"><div class="done-row" id="fDone"></div></div>
    <div class="glass"><div class="steps" id="fSteps"></div></div>
  </div>
</div>

<div class="tip glass" id="tip" hidden></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ================= DATA ================= */
const PARTS=[
 {id:'pcb',name:'Základná doska (PCB)',base:true,needs:[],ex:0,mat:'Sklolaminát FR-4 · meď',
  info:'Doska plošných spojov nesie procesor a spája ho so zvyškom počítača. Vo vnútri má 6 až 12 vrstiev medených ciest, ktoré vedú napájanie a dáta.',
  fact:'Cesty k pamäti musia mať rovnakú dĺžku s presnosťou na zlomky milimetra, inak by signály dorazili v rôznom čase.',
  why:'Všetko stojí na základnej doske.'},
 {id:'balls',name:'Guličky BGA',needs:['pcb'],ex:.6,mat:'Spájka SnAgCu',
  info:'Stovky malých guličiek zo spájky spájajú puzdro procesora s doskou. Každá gulička je jeden elektrický spoj: napájanie, zem alebo signál.',
  fact:'Pri spájkovaní sa guličky roztavia v peci pri asi 240 °C a povrchové napätie samo vycentruje puzdro na správne miesto.',
  why:'Guličky BGA tvoria elektrický spoj medzi doskou a puzdrom. Bez nich by puzdro ležalo na doske bez kontaktu.',
  rm:'V praxi sa BGA odspájkuje horúcim vzduchom pri asi 240 °C.',ins:'Guličky sedia na plôškach dosky.'},
 {id:'sub',name:'Substrát puzdra',needs:['balls'],ex:1.25,mat:'Laminát ABF · meď',
  info:'Substrát je malá doska, na ktorej sedí kremíkový čip. Rozvedie tisíce jemných spojov z čipu na väčšie guličky BGA, ktoré sa dajú prispájkovať na dosku.',
  fact:'Spoje v substráte sú až 10× jemnejšie ako na bežnej doske.',
  why:'Substrát funguje ako redukcia medzi čipom a doskou. Čip má spoje vzdialené asi 0,1 mm, doska asi 1 mm. Bez substrátu by sa nedali prepojiť.',
  rm:'Substrát je teraz voľný. Pod ním vidíš plôšky, na ktorých sedeli guličky.',ins:'Substrát sedí na guličkách BGA.'},
 {id:'caps',name:'SMD kondenzátory',needs:['sub'],ex:1.95,mat:'Keramika MLCC',
  info:'Malé keramické kondenzátory sú zásobníky energie hneď vedľa čipu. Keď čip náhle potrebuje veľký prúd, dodajú ho za nanosekundy.',
  fact:'Procesor dokáže zmeniť odber z 5 A na 100 A za menej ako mikrosekundu.',
  why:'Kondenzátory držia stabilné napätie. Bez nich napätie pri záťaži poklesne a procesor spadne.',
  rm:'Bez kondenzátorov by sa procesor pri záťaži reštartoval.',ins:'Kondenzátory sú na mieste a vyhladia napätie.'},
 {id:'bumps',name:'Mikro-bumpy (flip-chip)',needs:['sub'],ex:1.95,mat:'Meď · spájka',
  info:'Mikro-bumpy sú drobné medené stĺpiky so spájkou. Spájajú obvody čipu so substrátom. Čip je pri tom otočený obvodmi nadol, preto sa to volá flip-chip.',
  fact:'Jeden čip môže mať viac než 10 000 bumpov s roztečou asi 0,1 mm.',
  why:'Kremíkový čip sa so substrátom spája cez mikro-bumpy. Bez nich by nemal žiadne elektrické spojenie.',
  rm:'Bumpy sú preč. V skutočnosti sú zaliate lepidlom (underfill) a nedajú sa vybrať bez zničenia.',ins:'Bumpy sú pripravené na čip.'},
 {id:'die',name:'Kremíkový čip (die)',needs:['bumps'],ex:2.6,mat:'Monokryštalický kremík',
  info:'Toto je samotný procesor: kúsok kremíka s desiatkami miliárd tranzistorov. Vidíš 8 jadier, vyrovnávaciu pamäť (cache), grafiku a radič pamäte. Všetko okolo ho len napája, prepája a chladí.',
  fact:'Najmenšie štruktúry majú pár nanometrov. Ľudský vlas je asi 20 000× hrubší. Taký čip si môžeš vyrobiť v záložke Výroba čipu.',
  why:'Bez kremíkového čipu nie je čo chladiť. Spájka TIM1 sa kladie priamo na čip.',
  rm:'Čip si chytil za hrany. Na kremík sa nesiaha prstami.',ins:'Čip sedí na bumpoch obvodmi nadol.'},
 {id:'tim1',name:'Indiová spájka (TIM1)',needs:['die'],ex:3.2,mat:'Indium',
  info:'Tenká fólia india medzi čipom a rozvádzačom. Prenáša teplo z horúceho kremíka do kovového krytu.',
  fact:'Indium vedie teplo asi 10× lepšie ako bežná pasta.',
  why:'Medzi čipom a rozvádzačom musí byť tepelné rozhranie. Bez neho by vzduchová medzera prenášala teplo veľmi zle a čip by sa prehrial.',
  rm:'Fólia je dole.',ins:'Indium vyplní medzeru medzi čipom a krytom.'},
 {id:'ihs',name:'Tepelný rozvádzač (IHS)',needs:['tim1'],ex:4.0,mat:'Meď · nikel',
  info:'Kovový kryt chráni krehký kremík a rozloží teplo z malej plochy čipu na väčšiu plochu, ktorej sa dotýka chladič.',
  fact:'Je z poniklovanej medi. Meď dobre vedie teplo a nikel ju chráni pred oxidáciou.',
  why:'Pasta a chladič sa kladú na rovný povrch rozvádzača. Bez neho by tlačili priamo na krehký čip.',
  rm:'Kryt je dole. Teraz vidíš kremíkový čip a fóliu india.',ins:'Rozvádzač chráni čip.'},
 {id:'paste',name:'Teplovodivá pasta',needs:['ihs'],ex:4.8,mat:'Silikón · oxidy kovov',
  info:'Pasta vyplní mikroskopické nerovnosti medzi rozvádzačom a chladičom, aby v nich neostal vzduch.',
  fact:'Stačí kvapka veľkosti hrášku. Prítlak chladiča ju rozotrie.',
  why:'Bez pasty by medzi rozvádzačom a chladičom ostali vzduchové medzery. Vzduch vedie teplo asi 100× horšie a procesor by sa prehrieval.',

  if(o.fact){fact=document.createElement('p');fact.className='fact';fact.innerHTML='<b>Zaujímavosť:</b> '+o.fact;fact.hidden=true;m.appendChild(fact)}
  if(o.acts&&o.acts.length){const a=document.createElement('div');a.className='acts';o.acts.forEach(x=>{const b=document.createElement('button');b.className='btn'+(x.primary?' primary':'');b.textContent=x.label;b.onclick=()=>{x.fn();b.disabled=true};a.appendChild(b)});m.appendChild(a)}
  msgsEl.appendChild(m);
  const ret=m;
  while(msgsEl.children.length>24) msgsEl.firstChild.remove();
  const text=o.text||'';
  if(reduced||!text){body.textContent=text;if(fact)fact.hidden=false;msgsEl.scrollTop=msgsEl.scrollHeight;return ret}
  let i=0;const step=Math.max(2,Math.ceil(text.length/45));
  (function tick(){i=Math.min(text.length,i+step);body.textContent=text.slice(0,i);msgsEl.scrollTop=msgsEl.scrollHeight;if(i<text.length)requestAnimationFrame(tick);else if(fact){fact.hidden=false;msgsEl.scrollTop=msgsEl.scrollHeight}})();
  return ret;
}

function blockersOf(p){const out=[];const visit=id=>{PARTS.forEach(q=>{if(q.installed&&q.needs.includes(id)&&!out.includes(q)){visit(q.id);out.push(q)}})};visit(p.id);return out}
function missingFor(p){const out=[];const visit=id=>{const q=P[id];if(q.installed||out.includes(q))return;q.needs.forEach(visit);out.push(q)};p.needs.forEach(visit);return out}
const names=a=>a.map(q=>q.name).join(' → ');
function countRemoved(){return REMOVABLE.filter(p=>!p.installed).length}
function updateHUD(){
  const r=countRemoved();$('#sProg').textContent=r+' / '+REMOVABLE.length;$('#sMeter').style.width=(r/REMOVABLE.length*100)+'%';$('#sErr').textContent=mistakes;
}
function mistake(){mistakes++;updateHUD()}
function err(title,text,extra){say({kind:'err',pill:'Chyba',title,text,fact:extra});mistake()}
function canRemove(p){return !p.base&&p.installed&&blockersOf(p).length===0}
function tryRemove(p,quiet){
  if(p.base){say({title:p.name,text:'Základná doska ostáva na stole. Všetko ostatné sa skladá na ňu.'});return false}
  if(!p.installed)return false;
  const bl=blockersOf(p);
  if(bl.length){p.shake=.45;err('Toto sa ešte nedá vybrať','Na diele „'+p.name+'“ ešte leží '+bl[bl.length-1].name.toLowerCase()+'. Správne poradie je zhora nadol: '+names(bl)+' → '+p.name+'.');return false}
  p.installed=false;if(power!=='off')powerOff(true);
  if(!tStart)tStart=performance.now();
  if(!quiet)say({kind:'ok',pill:'Vybraté',title:p.name,text:p.rm||'Diel je dole.'});
  updateHUD();updateCut();
  if(countRemoved()===REMOVABLE.length&&!fullyApart){fullyApart=true;say({kind:'ok',pill:'Hotovo',title:'Procesor je rozobratý',text:'Všetkých 10 dielov leží na stole. Teraz ho zlož späť: ťahaj diely na dosku v správnom poradí, odspodu nahor.'})}
  return true;
}
function tryInstall(p){
  if(p.installed)return true;
  const miss=missingFor(p);
  if(miss.length){p.shake=.45;const first=miss[0];err('Sem ešte nepatrí','Diel „'+p.name+'“ potrebuje pod sebou: '+names(miss)+'.',first.why);return false}
  p.installed=true;p.slot=null;say({kind:'ok',pill:'Vložené',title:p.name,text:p.ins||'Sedí.'});
  updateHUD();updateCut();
  if(countRemoved()===0&&fullyApart){const t=Math.round((performance.now()-tStart)/1000);say({kind:'ok',pill:'Zložené',title:'Procesor je kompletný',text:'Rozobral si ho a zložil späť za '+Math.floor(t/60)+' min '+(t%60)+' s s počtom chýb '+mistakes+'. Stlač Zapnúť a over, či funguje.'});fullyApart=false;tStart=0}
  return true;
}
function describe(p){

}
const slotAngles=[115,140,165,190,215,240,265,290,315,342].map(a=>a*Math.PI/180);
function placeInTray(p,at){
  let x,z;
  if(at){x=at.x;z=at.z;p.slot=null}else{const used=REMOVABLE.filter(q=>!q.installed&&q!==p&&q.slot!=null).map(q=>q.slot);let s=0;while(used.includes(s)&&s<9)s++;p.slot=s;const r=6.6+p.rad;x=Math.cos(slotAngles[s])*r;z=Math.sin(slotAngles[s])*r}
  const v=new THREE.Vector2(x,z);

function fabRun(id,k,dt){
  const e=ease(k);

    case 'oxid':F.ox.forEach(m=>{m.visible=true;m.scale.y=Math.max(.001,e)});F.waferMat.color.lerpColors(new THREE.Color(0xffffff),new THREE.Color(0xa9d8ff),e);if(k>=1)F.labels.ox.visible=true;break;
    case 'resist':F.res.forEach(m=>{m.visible=true;m.scale.y=Math.max(.001,e)});F.waferSmall.rotation.y+=dt*30*Math.sin(Math.PI*k);F.waferMat.color.lerpColors(new THREE.Color(0xa9d8ff),new THREE.Color(0xffc887),e);if(k>=1)F.labels.res.visible=true;break;
    case 'litho':{F.mask.visible=k<1;F.mask.position.y=4.1+(1-ease(clamp(k/.25,0,1)))*3;const f=1-sstep(.85,1,k);F.maskMats.forEach((m,i)=>m.opacity=(i===0?.22:1)*f);const b=sstep(.25,.4,k)*(1-sstep(.75,.9,k));F.beams.forEach(x=>x.material.opacity=.42*b*(.85+.15*Math.sin(k*80)));const c=sstep(.35,.75,k);[1,3].forEach(i=>F.res[i].material.color.lerpColors(new THREE.Color(0xE6A03C),new THREE.Color(0x7A3E18),c));break}
    case 'develop':[1,3].forEach(i=>{F.res[i].scale.y=Math.max(.001,1-e);F.res[i].material.opacity=1-e*.6;if(k>=1)F.res[i].visible=false});break;
    case 'etch':[1,3].forEach(i=>{F.ox[i].scale.y=Math.max(.001,1-e);if(k>=1)F.ox[i].visible=false});if(Math.random()<.8)emit('plasma');break;
    case 'strip':[0,2,4].forEach(i=>{F.res[i].scale.y=Math.max(.001,1-e);F.res[i].material.opacity=1-e;if(k>=1)F.res[i].visible=false});if(k>=1){F.labels.res.visible=false;F.waferMat.color.set(0xb9d6f2)}break;
    case 'dope':[1,3].forEach(i=>{F.siTop[i].material.color.lerpColors(new THREE.Color(0x56637A),new THREE.Color(0x7A5CD8),e);F.siTop[i].material.emissive.set(0x7A5CD8);F.siTop[i].material.emissiveIntensity=.35*Math.sin(Math.PI*k)+.08*e});emit('ion');emit('ion');if(k>=1){F.labels.s.visible=F.labels.d.visible=true}break;
    case 'metal':F.cu.forEach((m,i)=>{const kk=clamp(k*1.3-(i>2?.3:0),0,1);m.visible=kk>0;m.scale.y=Math.max(.001,ease(kk))});F.waferMat.color.lerpColors(new THREE.Color(0xb9d6f2),new THREE.Color(0xf0b890),e);if(k>=1)F.labels.g.visible=true;break;
    case 'test':{
      if(k<.18){const a=ease(k/.18);F.block.visible=a<.5;F.waferSmall.visible=F.pedestal.visible=a<.5;Object.values(F.labels).forEach(l=>{if(a>=.5)l.visible=false});F.big.visible=a>=.5;F.big.scale.setScalar(Math.max(.01,a));break}
      F.big.visible=true;F.big.scale.setScalar(1);
      const n=F.diePos.length,upto=Math.floor(clamp((k-.18)/.78,0,1)*n);const c=new THREE.Color();
      for(let i=0;i<upto;i++){c.set(F.dieOk[i]?0x3FBF7A:0xE0574C);F.dies.setColorAt(i,c)}
      if(F.dies.instanceColor)F.dies.instanceColor.needsUpdate=true;
      const pi=Math.min(n-1,upto),[px,pz]=F.diePos[pi];F.probe.position.set(px,.1+Math.abs(Math.sin(k*120))*.12,pz);F.probe.visible=k<.97;break}

  }
}

const PN=900,pPos=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN),pStop=new Float32Array(PN);
for(let i=0;i<PN;i++)pPos[i*3+1]=-99;
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const dot=ctex(64,64,(g,w)=>{const r=g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.4,'rgba(255,255,255,.6)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,w)});
const pMat=new THREE.PointsMaterial({size:.09,map:dot,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0x9BE7FF});
const points=new THREE.Points(pGeo,pMat);points.frustumCulled=false;fab.add(points);
let pIdx=0;
function spawn(x,y,z,vx,vy,vz,life,stop=-99){const i=pIdx=(pIdx+1)%PN;pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;pLife[i]=life;pStop[i]=stop}
function emit(kind){
  const r=Math.random;
  if(kind==='bubble'){pMat.color.set(0x9BE7FF);pMat.size=.1;for(let k=0;k<3;k++)spawn((r()-.5)*6.2,1.62,(r()-.5)*2.8,(r()-.5)*.2,.8+r()*.8,(r()-.5)*.2,1.6)}
  if(kind==='plasma'){pMat.color.set(0xC08CFF);pMat.size=.11;[-1.45,1.45].forEach(x=>{for(let k=0;k<3;k++)spawn(x+(r()-.5)*1,1.65+r()*.3,(r()-.5)*2.8,(r()-.5)*.3,.6+r()*1.2,(r()-.5)*.3,1.2)})}
  if(kind==='ion'){pMat.color.set(0xB59BFF);pMat.size=.08;for(let k=0;k<4;k++){const x=(r()-.5)*6.2,z=(r()-.5)*2.8;const open=Math.abs(Math.abs(x)-1.45)<.5;spawn(x,5,z,0,-7-r()*2,0,1.2,open?1.45:1.96)}}
  if(kind==='spark'){pMat.color.set(0xFFE0A0);pMat.size=.07;for(let k=0;k<5;k++){const a=r()*6.28,rr=r()*3.3;spawn(Math.cos(a)*rr,.12,Math.sin(a)*rr,(r()-.5)*2,r()*2,(r()-.5)*2,.5)}}
}
function updateParticles(dt){
  for(let i=0;i<PN;i++){if(pLife[i]<=0)continue;pLife[i]-=dt;const j=i*3;pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;if(pPos[j+1]<pStop[i]||pLife[i]<=0){pLife[i]=0;pPos[j+1]=-99}}

  }

$('#tab-fab').onclick=()=>{if(mode!=='fab'){setMode('fab');if(fs.step===0)say({title:'Výroba čipu',text:'Vľavo je kremíkový wafer, v strede rez jedným tranzistorom. Dole vyber kroky výroby v správnom poradí. Keď sa pomýliš, vysvetlím ti prečo.'})}};
$('#models').addEventListener('click',e=>{const b=e.target.closest('.model');if(!b)return;if(b.dataset.m!=='chip')say({title:b.firstChild.textContent.trim(),text:'Tento model pripravujem. Bude sa dať rozobrať a zložiť rovnako ako mikročip. Zatiaľ si vyskúšaj procesor.'})});
$('#bExplode').onclick=()=>{exT=exT?0:1;$('#bExplode').setAttribute('aria-pressed',!!exT);shopCam();if(exT)say({title:'Rozložený pohľad',text:'Diely sa rozostúpili nad sebou, aby si videl celú vrstvu po vrstve. Klikni na hociktorý a poviem ti viac.'})};
$('#bCut').onclick=()=>{cut=!cut;$('#bCut').setAttribute('aria-pressed',cut);updateCut();if(cut)say({title:'Rez',text:'Procesor je prerezaný napoly. Vidíš, ako na sebe ležia guličky, substrát, čip, indium, kryt a chladič.'})};
$('#bPower').onclick=powerOn;
$('#bReset').onclick=()=>{PARTS.forEach(p=>{p.installed=true;p.slot=null;p.shake=0});if(power!=='off')powerOff(true);mistakes=0;fullyApart=false;tStart=0;temp=22;updateHUD();updateCut();say({title:'Reset',text:'Procesor je opäť zložený. Môžeš začať odznova.'})};
addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;tipEl.hidden=true}});
function setDockH(){const h=$('#dock').getBoundingClientRect().height;document.documentElement.style.setProperty('--dockH',h+'px')}
if(window.ResizeObserver)new ResizeObserver(setDockH).observe($('#dock'));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;setDockH();const dh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dockH'))||64;if(w>860)camera.setViewOffset(w,h,182,Math.round(dh/2),w,h);else camera.setViewOffset(w,h,0,Math.round(h*.16),w,h);camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ================= LOOP ================= */
const accent=new THREE.Color(),cool=new THREE.Color(0x7FD4FF),hot=new THREE.Color(0xFF4A2A),tmpC=new THREE.Color();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(camTween){camTween.t+=dt/camTween.dur;const k=ease(clamp(camTween.t,0,1));camera.position.lerpVectors(camTween.p0,camTween.p1,k);controls.target.lerpVectors(camTween.t0,camTween.t1,k);if(camTween.t>=1)camTween=null}
  controls.update();
  if(mode==='shop'){
    ex+=(exT-ex)*(1-Math.exp(-dt*5));
    accent.set(cssVar('--accent')||'#B05C28');
    PARTS.forEach(p=>{
      let tgt;
      if(drag.active&&p===drag.part)tgt=drag.pos;else if(p.installed)tgt=V(0,ex*p.ex,0);else tgt=V(p.tray.x,-p.minY,p.tray.z);
      p.group.position.lerp(tgt,1-Math.exp(-dt*(drag.active&&p===drag.part?18:7)));
      if(p.shake>0){p.shake-=dt;p.group.rotation.z=Math.sin(p.shake*70)*.03*(p.shake/.45)}else p.group.rotation.z=0;
      if(p.ghost&&p.ghost.visible)p.ghost.position.set(0,ex*p.ex,0);
      const hl=p===selected?.38:(p===hovered&&!drag.active?.22:0);
      p.mats.forEach(m=>{if(!m.emissive||p.id==='die'&&m===P.die.glowMat)return;if(hl){m.emissive.copy(accent);m.emissiveIntensity=hl}else{m.emissive.copy(m.userData.e0);m.emissiveIntensity=m.userData.i0}});
    });
    // power sim
    const on=power!=='off';
    if(on){
      if(power==='unstable'){powerT+=dt;temp+=(60-temp)*dt*.8;if(powerT>2.2){powerOff(true);err('Procesor spadol','Pri záťaži napätie kleslo pod 0,9 V a procesor sa reštartoval. Chýbali kondenzátory, ktoré dodávajú prúd pri náhlych špičkách.',P.caps.fact)}}
      else{const eq=eqTemp();temp+=(eq-temp)*dt*(eq>100?.55:.9);
        if(temp>=105){const miss=['tim1','ihs','paste','sink','fan'].filter(id=>!P[id].installed);const cause=P[miss[0]];powerOff(true);err('Prehriatie: 105 °C','Tepelná ochrana vypla procesor. Príčina: chýba '+cause.name.toLowerCase()+'.',cause.why||'Teplo sa nemá kam odviesť.')}}
    }else temp+=(22-temp)*dt*.35;
    $('#sTemp').textContent=(on||temp>23?Math.round(temp):'–')+' °C';$('#tempBox').classList.toggle('temp-hot',temp>85);
    fanSpeed+=((on&&P.fan.installed?28:0)-fanSpeed)*dt*1.5;P.fan.rotor.rotation.y+=fanSpeed*dt;
    const gm=P.die.glowMat;tmpC.copy(cool).lerp(hot,sstep(55,105,temp));gm.emissive.copy(tmpC);
    const pulse=on?(.75+.25*Math.sin(now/180)):0;gm.emissiveIntensity=on?.9*pulse:(selected===P.die?.45:(hovered===P.die?.3:.12));
    P.pcb.led.emissive.set(on?(temp>95?0xff3b30:0x35ff8a):0x000000);P.pcb.led.emissiveIntensity=on?2:0;P.pcb.ledLight.intensity=on?1.4:0;P.pcb.ledLight.color.set(temp>95?0xff3b30:0x35ff8a);
  }else{
    if(fs.anim){const a=fs.anim;a.t+=dt/a.s.dur;const k=clamp(a.t,0,1);fabRun(a.s.id,k,dt);if(a.t>=1)fabFinishStep(a.s)}
    if(F.waferSmall.visible&&!(fs.anim&&fs.anim.s.id==='resist'))F.waferSmall.rotation.y+=dt*.15;
    if(F.hero.visible&&!fs.anim)F.hero.rotation.y+=dt*.6;
    updateParticles(dt);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ================= BOOT ================= */
function start(){
  buildParts();buildFab();fabReset();applyTheme();resize();updateHUD();
  camera.position.set(11,10,14).multiplyScalar(camK());
  $('#loading').remove();
  say({title:'Ahoj, som tvoj AI sprievodca',text:'Pred tebou je procesor na základnej doske. Klikni na hociktorý diel a vysvetlím ti, čo robí. Ťahaním ho vyberieš a potom ho zase zložíš späť. Keď spravíš niečo zle, poviem ti prečo.',fact:'Skús najprv Rozložiť 3D alebo Rez, uvidíš všetky vrstvy naraz.'});
  requestAnimationFrame(t=>{last=t;frame(t)});
}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontsReady.then(start);
})();
</script>
</body>
