<title>Ground Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one-screen mobile app — status bar, pixel scene (16:9), station panel (scrolls), station tabs. */
:root {
  --bg: #0b1428; --deep: #060c18; --panel: #0d1a33; --line: #1d3354;
  --cyan: #3fe0ff; --violet: #9b7bff; --green: #5cffb0; --amber: #ffb547; --red: #ff5a5f;
  --text: #cfe9ff; --dim: #6b7d99; --paper: #ece6d3; --ink: #1d1a14;
  --f-ui: "VT323", "Courier New", ui-monospace, monospace;
  --f-title: "Press Start 2P", "VT323", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--deep); color: var(--text); font-family: var(--f-ui); font-size: 20px; line-height: 1.15; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: var(--f-ui); font-size: 20px; color: var(--cyan); background: var(--bg); border: 2px solid #26607a; padding: 7px 10px; cursor: pointer; text-align: left; border-radius: 0; }
button:active { background: #134055; color: #fff; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
button:disabled { color: var(--dim); border-color: #243049; background: var(--deep); }
#app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* status bar */
#top { display: flex; align-items: center; gap: 10px; padding-block: 8px 6px; border-bottom: 2px solid var(--line); }
#clock { color: var(--cyan); font-size: 21px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#clock.hold { color: var(--amber); }
.meter { display: grid; grid-template-columns: auto 54px; gap: 1px 5px; align-items: center; font-size: 17px; }
.meter i { display: block; height: 7px; background: var(--deep); border: 1px solid var(--line); position: relative; }
.meter i b { position: absolute; inset: 0 auto 0 0; }
#pauseBtn { padding: 2px 10px; font-size: 20px; }

/* scene */
#sceneWrap { position: relative; flex: none; }
#app.slim #scene { display: none; }
#app.slim #sceneWrap { height: auto; }
#app.slim #sub { display: none; }
#app.slim #notes { position: static; padding: 4px 16px 0; }
#app.slim #notes div { animation-duration: 3s; }
.lbl { font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.hint { color: var(--text); font-size: 18px; }
button.big { text-align: center; font-size: 22px; padding: 10px; }
button.big.att { border-color: var(--amber); color: var(--amber); }
.sysrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sysrow button { text-align: center; padding: 6px 2px; font-size: 18px; line-height: 1; color: var(--dim); }
.sysrow button small { font-size: 15px; }
.sysrow button.on { color: var(--amber); border-color: var(--amber); }
.trust { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; color: var(--violet); font-size: 17px; }
.screen { flex: none; border: 3px solid #2b4a3c; background: #000; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
.screen.amber { border-color: #5a4316; }
.screen .lbl { color: #3aa877; font-size: 15px; }
#scene { display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
.crt #sceneWrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
#notes { position: absolute; left: 8px; top: 6px; right: 8px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
#notes div { font-size: 17px; text-shadow: 0 0 2px #000, 1px 1px 0 #000; animation: noteFade 5s forwards; }
@keyframes noteFade { 0%,80% { opacity: 1 } 100% { opacity: 0 } }
#sub { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 18px; color: var(--green); text-shadow: 1px 1px 0 #000, 0 0 3px #000; text-align: center; pointer-events: none; }

/* station panel */
#panel { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.h { color: var(--cyan); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.box { border: 2px solid var(--line); background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box > .lbl { font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > button { flex: 1 1 40%; }
.log { max-height: 42vh; border: 2px solid var(--line); background: var(--panel); padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 19px; }
.log p { margin: 0; }
.log p.new { animation: lineIn .5s steps(6); }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px) } }
.sp-MIA { color: var(--green); } .sp-YOU { color: var(--cyan); } .sp-LOOP { color: var(--violet); } .sp-other { color: var(--amber); }
.choice { width: 100%; color: var(--cyan); }
.choice::before { content: "> "; color: var(--amber); }
.sys.on { border-color: var(--amber); color: var(--amber); }
.bar { height: 10px; background: var(--deep); border: 1px solid var(--line); position: relative; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--violet); }
.muted { color: var(--dim); font-size: 17px; }
.mia { color: var(--amber); }
canvas.map, canvas.cam { width: 100%; display: block; image-rendering: pixelated; touch-action: manipulation; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.ls { display: grid; grid-template-columns: 34px 1fr 44px; gap: 3px 6px; align-items: center; font-size: 17px; color: var(--green); }
.ls i { height: 8px; background: #02150c; border: 1px solid #12432d; position: relative; } .ls i b { position: absolute; inset: 0 auto 0 0; background: var(--green); }
.manual { color: var(--green); font-size: 18px; }
.manual .done { color: #2f7a57; text-decoration: line-through; }
.manual .next { color: #fff; }

/* board */
.cork { position: relative; flex: none; min-height: clamp(300px, 46vh, 480px); background: #8a5a32; background-image: radial-gradient(#6b4325 1px, transparent 1.5px), radial-gradient(#a36c3e 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; border: 6px solid #2a1c12; padding: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; align-content: start; }
.card { position: relative; background: #efe9d8; color: var(--ink); padding: 9px 5px 5px; font-size: 16px; line-height: 1.05; min-height: 58px; box-shadow: 2px 3px 0 rgba(0,0,0,.35); border-top: 5px solid var(--k, #3fe0ff); cursor: pointer; z-index: 1; }
.card::before { content: ""; position: absolute; top: -8px; left: 50%; width: 8px; height: 8px; margin-left: -4px; background: #c0392b; border-radius: 50%; box-shadow: 1px 1px 0 #000; }
.card small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 2px; }
.card.sel { outline: 3px solid var(--cyan); }
.card.ded { background: #ffe1e1; }
.card.flash-ok { animation: fok 1s; } .card.flash-bad { animation: fbad .6s; }
@keyframes fok { 0%,60% { outline: 4px solid var(--green) } }
@keyframes fbad { 0%,30%,60% { transform: translateX(-3px); outline: 3px solid var(--red) } 15%,45% { transform: translateX(3px) } }
.strings { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.inbox { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 4px; }
.inbox .card { flex: 0 0 31%; }
.detail { border-color: #3a5a7a; }
.detail .t { color: var(--cyan); }

/* fax & window */
.paper { background: var(--paper); color: var(--ink); border: 2px solid #b9ae90; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.paper .from { font-size: 16px; color: #5a4a30; }
.paper .t { font-size: 24px; font-weight: bold; }
.paper button { color: var(--ink); background: #f8f3e3; border-color: #8c826a; }
.faxlist { display: flex; gap: 6px; flex-wrap: wrap; }
.faxlist button { flex: 0 1 auto; font-size: 17px; padding: 4px 8px; }
.faxlist button.cur { border-color: var(--amber); color: var(--amber); }

/* tabs */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs button { border: 0; border-right: 1px solid var(--line); background: var(--deep); color: var(--dim); text-align: center; font-size: 17px; padding: 10px 2px 8px; position: relative; }
#tabs button:last-child { border-right: 0; }
#tabs button.cur { color: var(--cyan); background: var(--bg); box-shadow: inset 0 3px 0 var(--cyan); }
#tabs button.att::after { content: ""; position: absolute; top: 5px; right: 8px; width: 7px; height: 7px; background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0 } }

/* full-screen layers */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(3,6,12,.94); text-align: center; padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.layer .inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.layer button { text-align: center; font-size: 22px; padding: 10px; }
.title { font-family: var(--f-title); color: var(--cyan); font-size: clamp(22px, 7.4vw, 40px); line-height: 1.25; text-shadow: 0 0 8px rgba(63,224,255,.7), 0 0 22px rgba(63,224,255,.35); animation: glow 3s ease-in-out infinite; text-wrap: balance; }
@keyframes glow { 50% { text-shadow: 0 0 4px rgba(63,224,255,.5), 0 0 12px rgba(63,224,255,.2) } }
.subtitle { color: var(--violet); font-size: 26px; letter-spacing: .25em; }
#menuBg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; filter: blur(3px) brightness(.45); z-index: -1; }
#menu { background: #03060c; isolation: isolate; }
.date { font-family: var(--f-title); font-size: clamp(16px, 4.8vw, 24px); color: var(--cyan); line-height: 1.4; }
.intro-body { font-size: 22px; line-height: 1.3; text-wrap: pretty; }
.pulse { animation: blink 1.2s steps(2) infinite; color: var(--dim); }
.report { background: var(--paper); color: var(--ink); text-align: left; padding: 14px; border: 2px solid #b9ae90; display: grid; gap: 10px; }
.report .stats { font-size: 19px; white-space: pre; overflow-x: auto; font-variant-numeric: tabular-nums; }
.grade { font-family: var(--f-title); font-size: 46px; color: #8a2c24; }
.ach { display: flex; gap: 10px; align-items: center; text-align: left; border: 2px solid #2a3140; padding: 8px; background: #0b0f18; color: #59627a; }
.ach .ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: #1f2533; font-family: var(--f-title); font-size: 13px; }
.ach.on { border-color: var(--cyan); color: var(--text); background: #0e2333; box-shadow: 0 0 10px rgba(63,224,255,.35); }
.ach.on .ic { background: var(--cyan); color: var(--bg); }
.ach .n { font-size: 21px; } .ach.on .n { color: var(--cyan); }
#crisis { background: rgba(30,2,6,.9); }
#crisis .inner { border: 3px solid var(--red); background: #1a0306; padding: 14px; animation: cr 1s steps(2) infinite; box-shadow: 0 0 18px rgba(255,90,95,.35); }
@keyframes cr { 50% { border-color: #7a2328 } }
#crisis .ct { font-family: var(--f-title); font-size: 15px; color: var(--red); line-height: 1.4; }
#crisis .bar b { background: var(--red); }
#crisis button { text-align: left; font-size: 20px; }
#toast { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 40; display: flex; gap: 10px; align-items: center; background: var(--bg); border: 2px solid var(--cyan); box-shadow: 0 0 14px rgba(63,224,255,.4); padding: 8px 12px 8px 8px; transform: translateX(130%); transition: transform .35s; max-width: calc(100% - 20px); }
#toast.show { transform: none; }
#toast .ic { width: 40px; height: 40px; display: grid; place-items: center; background: var(--cyan); color: var(--bg); font-family: var(--f-title); font-size: 12px; flex: none; }
#ending { background: #000; z-index: 30; }
#ending .big { font-family: var(--f-title); color: var(--cyan); font-size: clamp(20px, 6.5vw, 36px); line-height: 1.35; text-shadow: 0 0 12px rgba(63,224,255,.6); min-height: 1.4em; }
#ending .small { color: var(--violet); font-size: 24px; min-height: 1.2em; }
#ending .cap { color: var(--green); font-size: 22px; min-height: 2.6em; }
#ending canvas { width: 100%; max-width: 520px; image-rendering: pixelated; opacity: 0; transition: opacity 2s; }
.chk { display: flex; justify-content: space-between; align-items: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  <div id="top" class="gut">
    <div id="clock">GROUND CONTROL</div>
    <div class="meter"><span style="color:var(--green)">O2</span><i><b id="o2b" style="background:var(--green);width:100%"></b></i><span style="color:var(--amber)">PWR</span><i><b id="pwb" style="background:var(--amber);width:100%"></b></i></div>

</div>

</div>

const DATA = {"achievements":{"achievements":[{"id":"houston","icon":"!!","title":"Houston, We Have a Problem","description":"Face your first crisis.","trigger":{"on":"crisis_started"}},{"id":"not_a_drop","icon":"O2","title":"Not a Drop Wasted","description":"Finish a shift without wasting any oxygen.","trigger":{"on":"day_report","match":{"no_oxygen_waste":true}}},{"id":"red_string","icon":"//","title":"Red String","description":"Make your first deduction on the board.","trigger":{"on":"deduction_found"}},{"id":"full_wall","icon":"##","title":"Full Wall","description":"Pin every card of the demo to the board.","trigger":{"on":"board_full"}},{"id":"rebel","icon":"><","title":"Rebel","description":"Disobey a direct order from HQ.","trigger":{"on":"flag_set","match":{"flag":"disobeyed_hq"}}},{"id":"blind_nav","icon":"()","title":"Blind Navigation","description":"Guide Mia to a site with the helmet camera switched off.","trigger":{"on":"navigation_success","match":{"helmet_cam":false}}},{"id":"best_colleagues","icon":"<3","title":"Best Colleagues","description":"Reach 90 rapport with Mia.","trigger":{"on":"trust_changed","match":{"min_value":90}}},{"id":"signal_acquired","icon":"))","title":"Signal Acquired","description":"Finish the demo.","trigger":{"on":"demo_complete"}}]},"cards":{"_types":"report | measurement | photo | fax | sample  (deduction cards are created from deductions.json)","_optional":"cards with \"optional\": true are not required for the Full Wall achievement","cards":{"c_charter":{"type":"report","title":"LOA Charter","text":"Lunar Operations Agency, chartered July 20, 1969. Before that date the agency — and all of its hardware — did not exist.","day":1},"c_selene_brief":{"type":"report","title":"Selene-1 Brief","text":"Mia Halloran. 30-day solo surface stay, Mare Serenitatis. Habitat at the lander, Site Alpha 1.2 km north-east.","day":1},"c_sample_14":{"type":"sample","title":"Sample #14 — Basalt","text":"Fine-grained basalt from the shadow at Site Alpha. Mia: 'It's warm. I can feel it through the glove.'","day":1},"c_thermal_alpha":{"type":"measurement","title":"Thermal Survey — Site Alpha","text":"Shadowed regolith at Site Alpha: -23 °C. Nothing in that shadow should be warm.","day":1},"c_pse_d1":{"type":"measurement","title":"PSE Log — Night 12","text":"Three micro-tremors: 02:14, 02:25, 02:36 — eleven minutes apart. Flagged 'thermal'.","day":1},"c_pse_d2":{"type":"measurement","title":"PSE Log — Night 13","text":"Tremors every 11.2 minutes, all day. Source depth about 40 m, directly beneath Site Alpha.","day":2},"c_radio_hum":{"type":"measurement","title":"S-Band Hum","text":"Low carrier noise on Mia's voice loop. It swells and fades every 11.2 minutes.","day":2},"c_geophone":{"type":"measurement","title":"Geophone Array","text":"Pulse shape repeats: 3-1-4 … 3-1-4 … Not noise. A pattern.","day":2},"c_hq_order":{"type":"fax","title":"HQ Order 71-114","text":"Classify the pulse as an instrument fault. The crew is not to be informed.","day":2},"c_supply":{"type":"fax","title":"Resupply Schedule","text":"Selene-2 cargo lander delayed to March 19. Crew to conserve consumables.","day":2,"optional":true},"c_probe_photo":{"type":"photo","title":"Helmet Cam Frame 0412","text":"A squat metal shape half-buried at the bottom of Rille Bend. Pitted, old, humming.","day":3},"c_probe_plaque":{"type":"photo","title":"The Plaque","text":"Stamped metal: 'LOA · GROUND CONTROL · UNIT 00 · 1958'.","day":3}}},"days":{"days":[{"id":"day1","year":1971,"date":"MARCH 3, 1971","date_short":"03 MAR 1971","title":"SHIFT 1 — NIGHT LOOP","era":"1970s","shift_minutes":10,"clock_start":"20:00","clock_end":"04:00","intro":["Lunar Operations Agency. Mission Control, Building 30-B.","Selene-1 has been on the Moon for twelve days. Mia Halloran is alone up there.","Tonight you are the new night CAPCOM — the only voice she will hear."],"resources":{"oxygen":100,"power":100,"temperature":21},"timeline":[{"at":0.0,"effects":[{"type":"visitor","id":"v_hale_d1"}]},{"at":0.02,"effects":[{"type":"dialogue","id":"d1_intro"}]},{"at":0.28,"effects":[{"type":"fax","id":"f_d1_thermal"}]},{"at":0.55,"effects":[{"type":"fax","id":"f_d1_pse"}]},{"at":0.84,"effects":[{"type":"dialogue","id":"d1_goodnight"}]}],"triggers":[{"id":"ruth_board_tip","on":"card_discovered","if":{"card":["c_sample_14","c_thermal_alpha"],"no_deduction":"ded_warm_rock"},"effects":[{"type":"visitor","id":"v_ruth_tip"}]}],"random_crises":{"count":[1,1],"pool":["c_o2_spike","c_signal_drop","c_micrometeorite"],"window":[0.4,0.7]},"side_missions":{"count":[1,1],"window":[0.35,0.6]}},{"id":"day2","year":1971,"date":"MARCH 4, 1971","date_short":"04 MAR 1971","title":"SHIFT 2 — INTERFERENCE","era":"1970s","shift_minutes":10,"clock_start":"20:00","clock_end":"04:00","intro":["Day thirteen on the surface.","The seismometer has been chattering since noon. Officially: thermal creep.","Unofficially, nobody in the building wants to talk about it."],"resources":{"oxygen":100,"power":95,"temperature":20},"timeline":[{"at":0.0,"effects":[{"type":"visitor","id":"v_ruth_d2"}]},{"at":0.02,"effects":[{"type":"dialogue","id":"d2_morning"}]},{"at":0.45,"effects":[{"type":"fax","id":"f_d2_supply"}]},{"at":0.7,"if":{"no_deduction":"ded_transmitter"},"effects":[{"type":"visitor","id":"v_ruth_hint_d2"}]},{"at":0.86,"effects":[{"type":"dialogue","id":"d2_night"}]}],"triggers":[],"random_crises":{"count":[1,2],"pool":["c_o2_spike","c_signal_drop","c_micrometeorite","c_power_surge"],"window":[0.3,0.75]},"side_missions":{"count":[1,1],"window":[0.4,0.65]}},{"id":"day3","year":1971,"date":"MARCH 5, 1971","date_short":"05 MAR 1971","title":"SHIFT 3 — THE GLINT","era":"1970s","shift_minutes":11,"clock_start":"20:00","clock_end":"04:00","intro":["Day fourteen.","Overnight, HQ declared Site Alpha off-limits. No reason given.","At sunrise, Mia saw something shining at the bottom of Rille Bend."],"resources":{"oxygen":100,"power":92,"temperature":20},"timeline":[{"at":0.0,"effects":[{"type":"visitor","id":"v_hale_d3"}]},{"at":0.02,"effects":[{"type":"dialogue","id":"d3_glint"}]}],"triggers":[{"id":"order_after_probe","on":"dialogue_finished","match":{"id":"d3_probe"},"effects":[{"type":"delay","seconds":4,"effects":[{"type":"fax","id":"f_d3_order"}]}]},{"id":"ruth_after_rebel","on":"flag_set","match":{"flag":"disobeyed_hq"},"effects":[{"type":"delay","seconds":8,"effects":[{"type":"visitor","id":"v_ruth_d3"}]}]}],"random_crises":{"count":[1,1],"pool":["c_o2_spike","c_micrometeorite","c_power_surge"],"window":[0.1,0.25]},"side_missions":{"count":[0,1],"window":[0.12,0.25]}}],"report_comments":{"A":"Textbook shift. If you keep this up they'll make you flight director someday. — W. Hale","B":"Solid work. Mia sounded calm on the loop. That's the job. — W. Hale","C":"Acceptable. Tighten up the procedures. — W. Hale","D":"Sloppy. Somebody up there is depending on you. — W. Hale","F":"We'll talk tomorrow. Get some sleep. — W. Hale"},"endings":{"signal_acquired":{"cliffhanger":["SIGNAL ACQUIRED","TO BE CONTINUED"],"teaser":{"era":"1980s","year":"1986","subtitle":"FIFTEEN YEARS LATER","captions":["OCTOBER 14, 1986 · LOA MISSION CONTROL","\"Director, this is Atlas Station. The pulse is back.\"","\"Same period. Eleven point two minutes.\"","\"And sir... it's still using your voice.\""],"title":"GROUND CONTROL","footer":"DECADE II · 1979 — 1988 · COMING LATER"}}}},"deductions":{"wrong_link_penalty_minutes":20,"deductions":[{"id":"ded_warm_rock","cards":["c_sample_14","c_thermal_alpha"],"title":"A Warm Stone","text":"Sample #14 was warm inside a -23 °C shadow. Something underneath is giving off heat.","effects":[{"type":"dialogue","id":"d1_warm"}]},{"id":"ded_period","cards":["c_pse_d1","c_pse_d2"],"title":"It Keeps Time","text":"Night 12 and Night 13 share the same 11.2-minute rhythm. Thermal creep doesn't keep time.","effects":[{"type":"notify","text":"Ruth will want to see this.","kind":"story"}]},{"id":"ded_same_source","cards":["c_pse_d2","c_radio_hum"],"title":"Two Channels, One Source","text":"The ground shakes and the radio hums on the same 11.2-minute beat. One source.","effects":[]},{"id":"ded_transmitter","cards":["ded_same_source","c_geophone"],"title":"Something Is Transmitting","text":"A structured pulse — 3-1-4 — from 40 m beneath Site Alpha. Not a fault. A signal.","effects":[{"type":"flag","name":"found_signal"},{"type":"fax","id":"f_d2_ignore"},{"type":"dialogue","id":"d2_signal"}]},{"id":"ded_cover_up","cards":["c_hq_order","ded_period"],"title":"They Knew","text":"HQ called it a fault before anybody filed a fault report. Someone was expecting this.","effects":[{"type":"flag","name":"suspects_hq"}]},{"id":"ded_older","cards":["c_probe_plaque","c_charter"],"title":"Older Than Us","text":"The agency was chartered in 1969. Its own plaque on the Moon says 1958.","effects":[{"type":"flag","name":"knows_older"},{"type":"trust","value":3}]},{"id":"ded_source_found","cards":["c_probe_photo","ded_transmitter"],"title":"The Source","text":"The probe sits right above the pulse. It was never buried deep — it was waiting.","effects":[{"type":"flag","name":"source_found"}]}]},"dialogues":{"idle":{"low":["Selene copies. Radio check good.","Loud and clear. Anything else?","Copy, Ground."],"mid":["Loud and clear. Earth's half-lit tonight. Looks like a marble somebody dropped.","Copy. I'm counting rivets in the hab ceiling. There are two hundred and eleven.","Reading you five by five. Tell the coffee machine I miss it."],"high":["Hey, Ground. I was hoping you'd call.","Five by five. You know, you're the best part of the night shift.","I'm here. Talk to me about anything. The quiet gets loud up here."]},"dialogues":{"d1_intro":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground, Selene. Loop check. ...You're not Daniels.","choices":[{"text":"Negative, Selene. New night CAPCOM. Good to meet you, Mia.","next":"warm","effects":[{"type":"trust","value":5}]},{"text":"Daniels rotated out. Let's keep the loop clean.","next":"cold","effects":[{"type":"trust","value":-3}]},{"text":"Daniels says hi. He also says you cheat at chess.","next":"joke","effects":[{"type":"trust","value":8}]}]},"warm":{"text":"'Mia.' Nobody's called me that in twelve days. Okay, new voice — you've got the monitors, I've got the dust.","next":"task"},"cold":{"text":"...Copy. Clean loop. Got it.","next":"task"},"joke":{"text":"Ha! He moves his king like it owes him money. Okay. I like you already.","next":"task"},"task":{"text":"Tonight's plan: a core sample at Site Alpha. I describe the ground, you read the terrain map and send me the right way. Deal?","choices":[{"text":"Deal. Terrain map is up on the monitors.","next":"go"},{"text":"Deal. And if the rover isn't needed, I'll switch it off to save power.","next":"go","effects":[{"type":"trust","value":2}]}]},"go":{"text":"Copy. Suiting up. Call me when you've found it on the map.","effects":[{"type":"mission","template":"nav_site_alpha"}],"end":true}}},"d1_sample":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground, I'm in the boulder's shadow. Taking the core now.","next":"warm"},"warm":{"text":"Huh. That's... strange. It's warm. I can feel it through the glove. Rocks in shadow should be colder than a freezer.","effects":[{"type":"card","id":"c_sample_14"}],"choices":[{"text":"Bag it. We'll log it as Sample #14.","next":"bag"},{"text":"Are you okay? Check your glove heater.","next":"glove","effects":[{"type":"trust","value":5}]}]},"bag":{"text":"Bagged and tagged. Sample #14. Heading back to the lander.","end":true},"glove":{"text":"Heater's off. It's the rock. ...Thanks for asking, though.","end":true}}},"d1_warm":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"You saw it too, didn't you? The thermal survey. That rock shouldn't be warm.","choices":[{"text":"Probably residual sunlight.","next":"skeptic","effects":[{"type":"trust","value":-2}]},{"text":"I saw it. I'm keeping an eye on it.","next":"trust","effects":[{"type":"trust","value":5}]}]},"skeptic":{"text":"In a shadow that hasn't seen the sun in a week? ...Sure. Residual.","end":true},"trust":{"text":"Good. I don't like being the only one who notices things up here.","end":true}}},"d1_goodnight":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Selene going to sleep period. Night, Ground.","variants":[{"if":{"min_trust":65},"text":"Ground, that's my sleep period. You were good company tonight. Same time tomorrow?"},{"if":{"max_trust":34},"text":"Sleep period. ...Selene out."}],"choices":[{"text":"Sleep well, Mia. Same time tomorrow.","next":"bye","effects":[{"type":"trust","value":2}]},{"text":"Ground copies. Out.","next":"bye"}]},"bye":{"speaker":"LOOP","text":"(The loop clicks over to carrier hiss. Somewhere under it, very faintly, something hums.)","effects":[{"type":"delay","seconds":6,"effects":[{"type":"end_day"}]}],"end":true}}},"d2_morning":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Morning, Ground. Or night. Whatever it is down there.","next":"hum"},"hum":{"text":"I didn't sleep much. When the loop goes quiet there's a hum in my headset. Comes and goes. Like breathing.","choices":[{"text":"I'll have Comms look at it.","next":"comms","effects":[{"type":"trust","value":3}]},{"text":"Describe it exactly. Timing, pitch.","next":"detail","effects":[{"type":"trust","value":6}]},{"text":"Probably your suit radio. Ignore it.","next":"dismiss","effects":[{"type":"trust","value":-5}]}]},"comms":{"text":"Thanks. Tell them it swells about every ten, eleven minutes.","next":"plan"},"detail":{"text":"Low. Like a cello far away. It swells and fades every eleven minutes, give or take. I timed it with my watch.","next":"plan"},"dismiss":{"text":"...Right. My suit radio. Sure.","next":"plan"},"plan":{"text":"Anyway. Ruth wants a geophone array out near Site Alpha. Guide me in?","effects":[{"type":"card","id":"c_radio_hum"},{"type":"mission","template":"nav_geophone"}],"end":true}}},"d2_signal":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground? You've gone quiet for a while. Is something wrong down there?","choices":[{"text":"Mia, there's a signal under Site Alpha. Something is transmitting.","next":"truth","effects":[{"type":"trust","value":10},{"type":"flag","name":"told_truth"}]},{"text":"Instrument fault. Nothing to worry about.","next":"lie","effects":[{"type":"trust","value":-8},{"type":"flag","name":"lied_to_mia"}]},{"text":"I can't talk about it on this loop. Not yet.","next":"vague","effects":[{"type":"trust","value":3}]}]},"truth":{"text":"...The hum. It's the hum, isn't it. Thank you for telling me. I know you weren't supposed to.","end":true},"lie":{"text":"Copy. Instrument fault.","variants":[{"if":{"min_trust":60},"text":"You're a terrible liar, Ground. But okay. I'll pretend."}],"end":true},"vague":{"text":"Understood. When you can — tell me first.","end":true}}},"d2_night":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground... the hum is louder tonight. Every eleven minutes. If I close my eyes it almost sounds like... words.","choices":[{"text":"Get some sleep, Mia. I'm right here.","next":"bye","effects":[{"type":"trust","value":3}]},{"text":"Leave the tape recorder running tonight.","next":"bye","effects":[{"type":"flag","name":"recorder_on"}]}]},"bye":{"speaker":"LOOP","text":"(Selene-1 enters sleep period. The hum swells. Fades. Swells.)","effects":[{"type":"delay","seconds":6,"effects":[{"type":"end_day"}]}],"end":true}}},"d3_glint":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground. Sunrise over Rille Bend. I saw a glint down there. Metal. Nothing of ours should be in that rille.","variants":[{"if":{"flag":"found_signal"},"text":"Ground. I couldn't sleep, so I watched sunrise over Rille Bend. There was a glint at the bottom. Metal. Right where the hum is loudest."}],"choices":[{"text":"Hale wants you inside the ring. ...But take a look. Quietly.","next":"go","effects":[{"type":"trust","value":5},{"type":"flag","name":"sent_to_rille"}]},{"text":"Negative. HQ says stay inside the perimeter.","next":"stay","effects":[{"type":"trust","value":-5}]}]},"go":{"text":"Thank you. Talk me down the slope?","next":"mission"},"stay":{"text":"Copy... I'm still going. I need to know. Will you at least guide me?","variants":[{"if":{"min_trust":60},"text":"I hear you. And I'm going anyway. Better with you than without you, Ground."}],"next":"mission"},"mission":{"text":"Plotting the route. The terrain map should show Rille Bend.","effects":[{"type":"mission","template":"nav_rille"}],"end":true}}},"d3_probe":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Ground... it's a probe. Old. Pitted. Half buried. Taking pictures.","effects":[{"type":"card","id":"c_probe_photo"}],"next":"plaque"},"plaque":{"text":"There's a plaque. It's... it's our logo, Ground. LOA. 'GROUND CONTROL — UNIT 00.' And a year. Nineteen fifty-eight.","effects":[{"type":"card","id":"c_probe_plaque"}],"choices":[{"text":"That's impossible. The agency didn't exist in '58.","next":"hum","effects":[{"type":"trust","value":2}]},{"text":"Don't touch anything. Just describe it.","next":"hum"}]},"hum":{"text":"I know. It's humming, Ground. Through my boots. Eleven minutes, right on time.","end":true}}},"d3_obey":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"...Copy, Ground. Leaving it. Heading back to the habitat.","variants":[{"if":{"min_trust":70},"text":"I trust you. If you say walk away, I'll walk away."}],"next":"stop"},"stop":{"text":"Wait. Ground, the hum just stopped. ...There's something on my loop now. Not the hum. A voice.","next":"voice"},"voice":{"speaker":"LOOP","text":"\"...Selene, this is Ground Control. Do you copy? Selene, this is Ground Control...\"","effects":[{"type":"sound","name":"signal"}],"next":"you"},"you":{"text":"That's... that's you, Ground. That's your voice. But you didn't say anything.","choices":[{"text":"Mia, I didn't transmit.","next":"final"},{"text":"Keep talking. Stay with me.","next":"final","effects":[{"type":"trust","value":3}]}]},"final":{"text":"Then who did?","effects":[{"type":"ending","id":"signal_acquired"},{"type":"delay","seconds":5,"effects":[{"type":"end_day"}]}],"end":true}}},"d3_help":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"You're serious? ...Okay. Okay. There's an access panel on the side. Check your manuals — if it's our hardware, there's a procedure.","effects":[{"type":"mission","template":"repair_probe"}],"end":true}}},"d3_voice_help":{"speaker":"MIA","start":"start","nodes":{"start":{"text":"Panel's open. There's a reel-to-reel inside. It's turning, Ground. It's playing something.","next":"voice"},"voice":{"speaker":"LOOP","text":"\"...Selene, this is Ground Control. Do you copy? Selene, this is Ground Control...\"","effects":[{"type":"sound","name":"signal"}],"next":"you"},"you":{"text":"That's your voice. On a tape older than both of us. Ground... who ARE you?","variants":[{"if":{"min_trust":70},"text":"That's you. That's your voice, Ground. On a tape from 1958. ...I'm not scared. I'm with you."}],"choices":[{"text":"I don't know.","next":"final"},{"text":"Mia — bring the tape home.","next":"final","effects":[{"type":"trust","value":3}]}]},"final":{"speaker":"LOOP","text":"(Carrier lock. SIGNAL ACQUIRED.)","effects":[{"type":"ending","id":"signal_acquired"},{"type":"delay","seconds":5,"effects":[{"type":"end_day"}]}],"end":true}}}}},"events":{"crises":{"c_o2_spike":{"title":"Suit pressure spike","text":"Mia's suit regulator reads 6.2 psi and climbing. Her breathing is getting fast.","timer":18,"mia_line":"Ground, my suit pressure is climbing — what do I do?","options":[{"text":"Open the purge valve, slowly","correct":true},{"text":"Switch to the backup O2 tank","correct":false},{"text":"Hold still and wait it out","correct":false}],"success_line":"Pressure's dropping... okay. Okay. Thanks, Ground.","fail_line":"That vented a lot of oxygen. I'm okay. I think.","success_effects":[{"type":"trust","value":3}],"fail_effects":[{"type":"oxygen","value":-6,"waste":true},{"type":"trust","value":-3}]},"c_signal_drop":{"title":"Signal dropout","text":"S-band carrier lost. Telemetry frozen. The voice loop is static.","timer":15,"mia_line":"Ground, you're breaking u—","options":[{"text":"Switch the uplink to the omni antenna","correct":true},{"text":"Boost transmitter power to maximum","correct":false,"effects":[{"type":"power","value":-8}]},{"text":"Re-send the last command block","correct":false}],"success_line":"There you are. Don't scare me like that.","fail_line":"...twenty minutes of static. I hate the quiet up here.","timeout_line":"...Ground? ...Ground? There you are. Twenty minutes of nothing.","success_effects":[{"type":"trust","value":2}],"fail_effects":[{"type":"time","minutes":20},{"type":"trust","value":-2}]},"c_micrometeorite":{"title":"Micrometeorite strike","text":"Impact on the habitat skin. Pressure falling in module B.","timer":20,"mia_line":"Something hit the hab! Module B is losing pressure!","options":[{"text":"Seal hatch B, patch it from the inside","correct":true},{"text":"Evacuate to the rover","correct":false},{"text":"Raise cabin pressure to compensate","correct":false}],"success_line":"Patch is holding. My hands are shaking, but it's holding.","fail_line":"We lost a lot of air before I got it sealed.","success_effects":[{"type":"trust","value":3}],"fail_effects":[{"type":"oxygen","value":-8,"waste":true},{"type":"power","value":-5},{"type":"trust","value":-3}]},"c_power_surge":{"title":"Power bus overvolt","text":"Main bus B overvolt. Breakers are about to trip across the habitat.","timer":16,"mia_line":"Ground, the breaker panel is buzzing. Lights are flickering!","options":[{"text":"Shed the heater load now","correct":true,"effects":[{"type":"system","name":"heat","value":false}]},{"text":"Reset every breaker at once","correct":false},{"text":"Ignore it, it'll settle","correct":false}],"success_line":"Bus is stable. It's getting chilly though — turn the heat back on when you can.","fail_line":"Everything tripped. I'm in the dark for a minute.","success_effects":[{"type":"trust","value":2}],"fail_effects":[{"type":"power","value":-12},{"type":"trust","value":-2}]}},"visitors":{"v_hale_d1":{"name":"Walt Hale","role":"Flight Director","color":"#e6e1d3","text":"Evening. You're the new night CAPCOM? Mia's on day twelve of thirty. Keep her breathing, keep her busy, keep the logs clean. The board behind you is yours — pin anything worth remembering. Here's her brief.","effects":[{"type":"card","id":"c_charter"},{"type":"card","id":"c_selene_brief"}]},"v_ruth_tip":{"name":"Ruth Okafor","role":"Systems Engineer","color":"#9b7bff","text":"A rock warmer than the shadow it sits in? Pin both cards to the board and tie them with string — click one, then the other. That's how I think, anyway.","effects":[]},"v_ruth_d2":{"name":"Ruth Okafor","role":"Systems Engineer","color":"#9b7bff","text":"The seismometer's been chattering all day. Hale says thermal creep. Funny kind of creep that keeps perfect time. Here's today's log.","effects":[{"type":"card","id":"c_pse_d2"}]},"v_ruth_hint_d2":{"name":"Ruth Okafor","role":"Systems Engineer","color":"#9b7bff","text":"Three things beat at the same rhythm: the tremor log, the hum in her radio... and whatever the geophones heard. Tie the first two together, then tie that to the geophones.","effects":[]},"v_hale_d3":{"name":"Walt Hale","role":"Flight Director","color":"#e6e1d3","text":"HQ wants Site Alpha off-limits. She stays inside the two-kilometer ring tonight. No detours. I don't make the rules, I just enforce them. Understood?","button":"UNDERSTOOD","effects":[{"type":"flag","name":"perimeter_order"}]},"v_ruth_d3":{"name":"Ruth Okafor","role":"Systems Engineer","color":"#9b7bff","text":"I didn't see that fax. I didn't see anything. ...Bring her home safe.","effects":[{"type":"trust","value":2}]}},"faxes":{"f_d1_thermal":{"from":"Surface Science Office","ref":"SSO-71-031","title":"Thermal survey — Site Alpha","body":"Infrared pass complete. Shadowed regolith at Site Alpha measured at -23 °C, consistent with models. No anomalies expected.","card":"c_thermal_alpha"},"f_d1_pse":{"from":"Seismic Network Desk","ref":"PSE-N12","title":"Passive seismic log — Night 12","body":"Three micro-tremors recorded at 02:14, 02:25 and 02:36 station time. Classified as thermal. Filed for completeness.","card":"c_pse_d1"},"f_d2_supply":{"from":"Logistics","ref":"LOG-71-077","title":"Resupply delayed","body":"Selene-2 cargo lander slips to March 19. Crew is to conserve power and consumables until further notice.","card":"c_supply"},"f_d2_ignore":{"from":"Office of the Deputy Administrator","ref":"HQ-71-114 · EYES ONLY","title":"RE: PSE anomaly","body":"The periodic signal is an instrument fault. Log it as such. It is not to be discussed on the open loop, and the crew is not to be informed. Acknowledge.","card":"c_hq_order","required":true,"choices":[{"label":"COMPLY","effects":[{"type":"flag","name":"complied_d2"}]},{"label":"PUSH BACK","effects":[{"type":"flag","name":"questioned_hq"},{"type":"notify","text":"HQ: 'Noted.' Nothing else.","kind":"alert"}]}]},"f_d3_order":{"from":"Office of the Deputy Administrator","ref":"HQ-71-120 · PRIORITY","title":"DIRECT ORDER","body":"The crew is to leave the object undisturbed and return to the habitat immediately. Do not open, move or photograph it further. This is a direct order.","required":true,"choices":[{"label":"RELAY THE ORDER","effects":[{"type":"flag","name":"obeyed_hq"},{"type":"dialogue","id":"d3_obey"}]},{"label":"HELP HER OPEN IT","effects":[{"type":"flag","name":"disobeyed_hq"},{"type":"trust","value":5},{"type":"dialogue","id":"d3_help"}]}]}}},"missions":{"map":{"width":12,"height":8,"home":[2,6]},"landmark_names":["Twin Craters","Dorsa Ridge","Boulder Field","Sinuous Rille","Dark Halo Pit","Lone Peak","Glass Crater","Shadow Ridge","Block Field","Ghost Channel"],"directions":{"north":[0,-1],"south":[0,1],"east":[1,0],"west":[-1,0]},"distance_words":{"1":"one grid","2":"two grids"},"near_lines":["Close... the site's one grid over, I can see it from here.","Almost. It's right next to me, wrong square."],"wrong_lines":["Nothing here, Ground. That walk cost me air.","Negative. Wrong spot. Check the map again?","I'm standing on bare regolith. Where now?"],"ok_lines":["Done. Next step?","Copy. Next.","Okay... that worked. What's next?"],"bad_lines":["Sparks! That wasn't the right step.","Whoa — that tripped something. Not that one.","Negative, that made it worse."],"templates":[{"id":"nav_survey","type":"navigation","random":true,"weight":3,"title":"Photo survey","brief":["Ground, Science wants a photo survey {dist} {dir} of the {landmark}. Which grid?","Next stop: survey panorama {dist} {dir} of the {landmark}. Point me there?"],"rover_cost":1.0,"walk_cost":3.0,"wrong_cost":3.0,"max_attempts":3,"success_lines":["Panorama done. Pretty out here, Ground.","Got the frames. Heading back."],"fail_lines":["I'm calling it, Ground. We'll try the survey another night."],"card":{"type":"photo","title":"Survey #{n}","text":"Panorama taken {dist} {dir} of the {landmark}. Nothing unusual."},"on_success":[{"type":"trust","value":2}],"on_fail":[{"type":"trust","value":-3}]},{"id":"nav_sample","type":"navigation","random":true,"weight":3,"title":"Core sample","brief":["Geology wants a core {dist} {dir} of the {landmark}. Where do I go?","Sample request: {dist} {dir} of the {landmark}. Your call, Ground."],"rover_cost":1.0,"walk_cost":3.0,"wrong_cost":3.5,"max_attempts":3,"success_lines":["Core's in the bag.","Sample secured. Logging it now."],"fail_lines":["Too much walking, Ground. I'm heading home."],"card":{"type":"sample","title":"Core #{n}","text":"Core taken {dist} {dir} of the {landmark}. Ordinary mare basalt."},"on_success":[{"type":"trust","value":2}],"on_fail":[{"type":"trust","value":-3}]},{"id":"nav_instrument","type":"navigation","random":true,"weight":2,"titl // ------------------------------------------------------------------ utils
const $ = s => document.querySelector(s);
const list = v => v == null ? [] : Array.isArray(v) ? v : [v];
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {

const settings = Object.assign({ sound: true, crt: true }, store.get("gc_settings", {}));

// ------------------------------------------------------------------ audio (WebAudio placeholders)
const SFX = {
  ui_click: [[1400], .03, "square", .08], radio_beep: [[880, 1320], .22, "sine", .2], radio_static: [[0], .3, "noise", .06],
  alarm: [[660, 440, 660, 440], .9, "square", .12], phone_ring: [[1150, 1400, 1150, 1400], .8, "sine", .15], knock: [[140, 1, 140], .3, "sine", .4],
  switch: [[0], .04, "noise", .2], card_pin: [[220], .06, "sine", .3], string_ok: [[523, 784, 1046], .35, "sine", .2], string_fail: [[220, 155], .35, "square", .1],
  achievement: [[523, 659, 784, 1046], .6, "square", .1], crisis_ok: [[660, 990], .3, "sine", .2], crisis_fail: [[300, 200, 150], .5, "square", .1],
  nav_ok: [[700, 1050], .25, "sine", .2], nav_fail: [[260], .25, "square", .1], signal: [[110, 220, 165, 110], 1.6, "sine", .25], paper: [[0], .18, "noise", .08], fax: [[0], .5, "noise", .05],
};
let actx = null, hum = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function sfx(n) {
  if (!settings.sound) return;
  const a = audio(); if (!a) return;
  try {
    const [fr, dur, wave, vol] = SFX[n] || SFX.ui_click, t0 = a.currentTime, g = a.createGain();
    g.connect(a.destination); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .005);
    g.gain.setValueAtTime(vol, t0 + dur * .7); g.gain.linearRampToValueAtTime(0, t0 + dur);
    if (wave === "noise") {
      const b = a.createBuffer(1, Math.max(1, a.sampleRate * dur | 0), a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = a.createBufferSource(); s.buffer = b; s.connect(g); s.start(t0);
    } else {
      const o = a.createOscillator(); o.type = wave; const seg = dur / fr.length;
      fr.forEach((f, i) => o.frequency.setValueAtTime(f || 1, t0 + i * seg));
      o.connect(g); o.start(t0); o.stop(t0 + dur + .05);
    }
  } catch (e) {}
}
function setHum(on) {
  const a = audio(); if (!a) return;
  try {
    if (on && settings.sound && !hum) {
      const g = a.createGain(); g.gain.value = .025; g.connect(a.destination);
      const o1 = a.createOscillator(); o1.frequency.value = 55; o1.connect(g); o1.start();
      const o2 = a.createOscillator(); o2.frequency.value = 110; const g2 = a.createGain(); g2.gain.value = .3; o2.connect(g2); g2.connect(g); o2.start();
      hum = { g, o1, o2 };
    } else if ((!on || !settings.sound) && hum) { hum.o1.stop(); hum.o2.stop(); hum.g.disconnect(); hum = null; }
  } catch (e) {}
}

// ------------------------------------------------------------------ data indexes
const DAYS = DATA.days.days, CARDS = DATA.cards.cards, DEDS = DATA.deductions.deductions, DLG = DATA.dialogues.dialogues;
const IDLE = DATA.dialogues.idle, EV = DATA.events, MIS = DATA.missions, ACH = DATA.achievements.achievements;
const TPL = {}; MIS.templates.forEach(t => TPL[t.id] = t);
const MAPW = MIS.map.width, MAPH = MIS.map.height, HOME = { x: MIS.map.home[0], y: MIS.map.home[1] };
const STATIONS = [["board", "BOARD"], ["monitors", "SCREENS"], ["console", "RADIO"], ["window", "WINDOW"], ["phone", "FAX"]];
const RATES = { o2: .045, pw: .02, sys: { heat: .035, lights: .015, rover: .025, cam: .015 }, cold: 10, coldMul: 1.3, darkMul: 2, tTarget: 21, tRise: .08, tDrop: .06, tMin: -5 };
const SYSNAME = { heat: "HEATING", lights: "HAB LIGHTS", rover: "ROVER", cam: "HELMET CAM" };

// ------------------------------------------------------------------ state
let S;
function freshState() {
  return { day: 0, trust: 50, flags: {}, ending: "", inGame: false, fired: {}, stats: {},
    time: 0, shift: 600, cStart: 1200, cSpan: 480, hold: false,
    o2: 100, pw: 100, temp: 21, sys: { heat: true, lights: true, rover: true, cam: true }, wasted: 0, warned: {},
    discovered: [], pinned: [], links: [], deds: [], dyn: {}, failed: [], fullWall: false,
    queue: [], dlg: null, log: [],
    schedule: [], faxInbox: [], faxArchive: [], visitor: null, visitorQ: [], crisis: null, delays: [],
    mission: null, pending: [], mia: { ...HOME }, landmarks: [], mcount: 0 };
}
let unlocked = store.get("gc_ach", {});
let station = "console", paused = true, selCard = null, faxShown = null, subTimer = 0, dirty = true;

// ------------------------------------------------------------------ events / achievements / triggers
function valEq(a, b) { return typeof a === "number" && typeof b === "number" ? Math.abs(a - b) < 1e-6 : a === b; }
function matches(tr, name, data) {
  if (tr.on !== name) return false;
  for (const [k, v] of Object.entries(tr.match || {})) {
    if (k.startsWith("min_")) { if (!((data[k.slice(4)] ?? -Infinity) >= v)) return false; }
    else if (k.startsWith("max_")) { if (!((data[k.slice(4)] ?? Infinity) <= v)) return false; }
    else if (!valEq(data[k], v)) return false;
  }
  return true;
}
function emit(name, data = {}) {
  ACH.forEach(a => { if (!unlocked[a.id] && matches(a.trigger, name, data)) unlock(a.id); });
  if (S && S.inGame) (day().triggers || []).forEach((tr, i) => {
    const key = tr.id || "t" + i;
    if (tr.once !== false && S.fired[key]) return;
    if (!matches(tr, name, data) || !cond(tr.if)) return;
    S.fired[key] = true; apply(tr.effects);
  });
}
const toastQ = []; let toasting = false;
function unlock(id) {
  if (unlocked[id]) return; const a = ACH.find(x => x.id === id); if (!a) return;
  unlocked[id] = Date.now(); store.set("gc_ach", unlocked); toastQ.push(a); if (!toasting) nextToast();
}
function nextToast() {
  const a = toastQ.shift(); if (!a) { toasting = false; return; }
  toasting = true; $("#tIc").textContent = a.icon; $("#tTx").textContent = a.title; sfx("achievement");
  $("#toast").classList.add("show");
  setTimeout(() => { $("#toast").classList.remove("show"); setTimeout(nextToast, 450); }, 3200);
}
function note(text, kind = "info") {
  const c = { info: "var(--cyan)", card: "var(--violet)", alert: "var(--amber)", story: "var(--green)", radio: "var(--green)" }[kind] || "var(--cyan)";
  const d = document.createElement("div"); d.style.color = c; d.textContent = text;
  const n = $("#notes"); n.appendChild(d); while (n.children.length > 4) n.firstChild.remove();
  setTimeout(() => d.remove(), 5200);
}
function sub(speaker, text) { const s = $("#sub"); s.textContent = speaker + ": " + text; s.style.color = speaker === "YOU" ? "var(--cyan)" : speaker === "LOOP" ? "var(--violet)" : "var(--green)"; subTimer = clamp(2 + text.length * .05, 3, 9); }

// ------------------------------------------------------------------ effects & conditions
function cond(c) {
  if (c == null) return true;
  if (Array.isArray(c)) return c.every(cond);
  for (const [k, v] of Object.entries(c)) {
    const L = list(v);
    if (k === "flag" && !L.every(f => S.flags[f])) return false;
    if (k === "not_flag" && L.some(f => S.flags[f])) return false;
    if (k === "min_trust" && S.trust < v) return false;
    if (k === "max_trust" && S.trust > v) return false;
    if (k === "card" && !L.every(x => S.discovered.includes(x))) return false;
    if (k === "deduction" && !L.every(x => S.deds.includes(x))) return false;
    if (k === "no_deduction" && L.some(x => S.deds.includes(x))) return false;
    if (k === "min_day" && S.day + 1 < v) return false;
    if (k === "any" && !L.some(cond)) return false;
  }
  return true;
}
function apply(effects) { list(effects).forEach(e => { if (e && (!("if" in e) || cond(e.if))) applyOne(e); }); dirty = true; }
function applyOne(e) {
  switch (e.type) {
    case "trust": trust(e.value | 0); break;
    case "flag": setFlag(e.name, e.value ?? true); break;
    case "card": discover(e.id); break;
    case "dialogue": queueDlg(e.id); break;
    case "say": say(e.speaker || "MIA", e.text); break;
    case "fax": queueFax(e.id); break;
    case "visitor": showVisitor(e.id); break;
    case "crisis": startCrisis(e.id); break;
    case "mission": queueMission(e.template || "random", e.params || {}); break;
    case "oxygen": changeO2(+e.value || 0, !!e.waste); break;
    case "power": S.pw = clamp(S.pw + (+e.value || 0), 0, 100); break;
    case "system": setSys(e.name, e.value !== false); break;
    case "time": penalty(+e.minutes || 0); break;
    case "achievement": unlock(e.id); break;
    case "notify": note(e.text, e.kind || "info"); break;
    case "event": emit(e.name, e.data || {}); break;
    case "stat": stat(e.name, e.value ?? 1); break;
    case "sound": sfx(e.name); break;
    case "ending": S.ending = e.id || "signal_acquired"; break;
    case "end_day": setTimeout(() => finishDay(false), 0); break;
    case "delay": S.delays.push({ t: +e.seconds || 1, effects: e.effects }); break;
  }
}
function trust(d) { if (!d) return; S.trust = clamp(S.trust + d, 0, 100); emit("trust_changed", { value: S.trust, delta: d }); }
function setFlag(n, v) { S.flags[n] = v; emit("flag_set", { flag: n, value: v }); }
function stat(n, v = 1) { S.stats[n] = (S.stats[n] || 0) + v; }
const day = () => DAYS[S.day] || {};

// ------------------------------------------------------------------ time & resources
function clockStr() { const m = (S.cStart + Math.floor(prog() * S.cSpan)) % 1440; return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
const prog = () => clamp(S.time / S.shift, 0, 1);
function penalty(min) { if (!S.inGame || min <= 0) return; S.time = Math.min(S.time + min / S.cSpan * S.shift, S.shift * .96); note("-" + (min | 0) + " MIN", "alert"); }
function pendingStory() { return !!S.dlg || S.queue.length > 0 || S.faxInbox.some(f => EV.faxes[f]?.required) || (S.mission && S.mission.story) || S.pending.some(m => m.story); }
function changeO2(v, waste) { S.o2 = clamp(S.o2 + v, 0, 100); if (waste && v < 0) { S.wasted += -v; note("O2 LOST " + (-v).toFixed(1) + "%", "alert"); } }
function powerDraw() { let p = RATES.pw; for (const k in S.sys) if (S.sys[k]) p += RATES.sys[k]; return p; }
function setSys(n, on) {
  if (!(n in S.sys)) return;
  if (on && S.pw <= 0) { note("NO POWER — " + SYSNAME[n] + " CANNOT START", "alert"); on = false; }
  if (S.sys[n] === on) return; S.sys[n] = on; emit("system_toggled", { system: n, on }); dirty = true;
}
function warnOnce(k, c, t) { if (c && !S.warned[k]) { S.warned[k] = 1; note(t, "alert"); sfx("alarm"); } }

function update(dt) {
  // clock
  if (prog() >= .96 && pendingStory()) S.hold = true;
  else { S.hold = false; S.time += dt; }
  // schedule
  const p = prog();
  while (S.schedule.length && S.schedule[0].at <= p) { const e = S.schedule.shift(); if (cond(e.if)) apply(e.effects); }
  // delayed effects
  for (const d of S.delays.slice()) { d.t -= dt; if (d.t <= 0) { S.delays.splice(S.delays.indexOf(d), 1); if (S.inGame) apply(d.effects); } }
  // resources
  let drain = RATES.o2; if (S.temp < RATES.cold) drain *= RATES.coldMul; if (S.pw <= 0) drain *= RATES.darkMul;
  S.o2 = Math.max(0, S.o2 - drain * dt); S.pw = Math.max(0, S.pw - powerDraw() * dt);
  if (S.pw <= 0 && Object.values(S.sys).some(Boolean)) { for (const k in S.sys) S.sys[k] = false; note("POWER DEPLETED — ALL SYSTEMS OFFLINE", "alert"); sfx("alarm"); dirty = true; }
  const tgt = S.sys.heat && S.pw > 0 ? RATES.tTarget : RATES.tMin, rate = S.sys.heat && S.pw > 0 ? RATES.tRise : RATES.tDrop;
  S.temp += clamp(tgt - S.temp, -rate * dt, rate * dt);
  warnOnce("o2a", S.o2 < 25, "OXYGEN BELOW 25%"); warnOnce("o2b", S.o2 < 10, "OXYGEN CRITICAL");
  warnOnce("pw", S.pw < 20, "POWER BELOW 20% — SHUT DOWN SYSTEMS"); warnOnce("cold", S.temp < RATES.cold, "HABITAT IS GETTING COLD");
  if (S.o2 <= 0 && !S.warned.dead) { S.warned.dead = 1; note("OXYGEN CRITICAL — SHIFT ABORTED", "alert"); finishDay(true); return; }
  // mission travel
  const m = S.mission;
  if (m && m.state === "travel") { m.tt += dt / m.travelTime; if (m.tt >= 1) { S.mia = { ...m.target }; finishMission(true); } }
  // crisis timer
  if (S.crisis) { S.crisis.left -= dt; if (S.crisis.left <= 0) resolveCrisis(-1); }
  if (S.time >= S.shift && S.inGame) finishDay(false);
}

// ------------------------------------------------------------------ board
function card(id) { return S.dyn[id] || CARDS[id] || { title: id, type: "report", text: "" }; }

  if (nav && m.state === "travel") { const f = clamp(m.tt, 0, 1), cx2 = m.target.x, l1 = Math.abs(cx2 - m.from.x), l2 = Math.abs(m.target.y - m.from.y), d = f * (l1 + l2 || 1);
    if (d <= l1) { mx = m.from.x + Math.sign(cx2 - m.from.x) * d; my = m.from.y; } else { mx = cx2; my = m.from.y + Math.sign(m.target.y - m.from.y) * (d - l1); }
    c.strokeStyle = "rgba(92,255,176,.5)"; c.beginPath(); c.moveTo((m.from.x + .5) * cell, (m.from.y + .5) * cell); c.lineTo((cx2 + .5) * cell, (m.from.y + .5) * cell); c.lineTo((cx2 + .5) * cell, (m.target.y + .5) * cell); c.stroke(); }
  if ((performance.now() / 400 | 0) % 2 || (nav && m.state === "travel")) { const px = (mx + .5) * cell, py = (my + .5) * cell, s2 = cell * .3; c.strokeStyle = "#5cffb0"; c.lineWidth = 2; c.beginPath(); c.moveTo(px - s2, py); c.lineTo(px + s2, py); c.moveTo(px, py - s2); c.lineTo(px, py + s2); c.stroke(); c.lineWidth = 1; }
}
function drawCam() {
  const cv = $("#cam"); if (!cv) return; const c = cv.getContext("2d"), t = performance.now() / 1000, G = "#5cffb0";
  const ok = S.sys.cam && S.pw > 0 && S.crisis?.id !== "c_signal_drop";
  if (!ok) { R(c, 0, 0, 160, 96, "#050a07"); for (let i = 0; i < 260; i++) { const v = Math.random(); R(c, Math.random() * 160, Math.random() * 96, 3, 3, `rgba(${v * 120},${v * 160},${v * 130},1)`); } c.fillStyle = "#000"; c.fillRect(0, 40, 160, 16); c.fillStyle = G; c.font = "10px monospace"; c.fillText(S.sys.cam ? "SIGNAL LOST" : "NO VIDEO — CAM OFF", 22, 52); return; }
  const walk = S.mission?.state === "travel", pan = t * (walk ? .25 : .05), bob = Math.sin(t * (walk ? 9 : 1.2)) * (walk ? 2 : .6), hz = 52 + bob;
  R(c, 0, 0, 160, 96, "#000805"); for (let i = 0; i < 30; i++) R(c, ((i * 47 + 3) % 160 - pan * 16 + 160) % 160, (i * 29) % 46 + bob * .3, 1, 1, "#3aa877");
  c.fillStyle = "#1f5a3f"; c.beginPath(); c.arc(((112 - pan * 16) % 160 + 160) % 160, 16, 5, 0, 7); c.fill();
  c.fillStyle = "#12382a"; c.beginPath(); c.moveTo(0, 96); for (let i = 0; i <= 16; i++) c.lineTo(i * 10, hz + Math.sin(i * 1.7 + pan * 8) * 3); c.lineTo(160, 96); c.fill();
  for (let y = hz + 6; y < 96; y += 2 + (y - hz) * .15) R(c, 0, y, 160, 1, "#0c2a1e");
  for (let i = 0; i < 9; i++) { const x = (((i * 61) % 300) / 100 - pan) % 3; const rx = ((x + 3) % 3) / 3 * 220 - 30, ry = hz + 8 + (i * 7) % 30, rs = 2 + (ry - hz) * .12; R(c, rx, ry - rs, rs * 2, rs, "#2c7a57"); }
  if (S.flags.probe_seen) { R(c, 80, hz + 10, 18, 9, "#8fe6bd"); R(c, 82, hz + 2, 1, 8, G); R(c, 94, hz + 4, 1, 6, G); if ((t * .6) % 1 < .5) R(c, 88, hz + 13, 2, 2, "#fff"); }
  c.fillStyle = G; c.font = "9px monospace"; c.fillText("CAM-1", 3, 9); c.fillText("HDG " + String(Math.floor((90 + pan * 40) % 360)).padStart(3, "0"), 3, 93); if ((t % 1) < .5) { c.fillStyle = "#ff5a5f"; c.fillRect(134, 3, 5, 5); } c.fillStyle = G; c.fillText("REC", 141, 9);
}

// ------------------------------------------------------------------ live HUD
function hud() {
  if (!S) return;
  const d = day(); $("#clock").textContent = S.inGame || paused ? `DAY ${S.day + 1} · ${d.date_short || ""} · ${clockStr()}${S.hold ? " · HELD" : ""}` : "GROUND CONTROL";
  $("#clock").classList.toggle("hold", S.hold);
  $("#o2b").style.width = S.o2 + "%"; $("#pwb").style.width = S.pw + "%";
  if (S.crisis) { const b = $("#cBar"); if (b) b.style.width = clamp(S.crisis.left / S.crisis.total * 100, 0, 100) + "%"; }
  if (station === "monitors") { document.querySelectorAll(".lsb").forEach(b => { const v = { O2: S.o2, PWR: S.pw, TMP: S.temp / .3 }[b.dataset.k]; b.style.width = clamp(v, 0, 100) + "%"; }); document.querySelectorAll(".lsv").forEach(s => s.textContent = { O2: (S.o2 | 0) + "%", PWR: (S.pw | 0) + "%", TMP: (S.temp | 0) + "C" }[s.dataset.k]); drawMap(); drawCam(); }
}

// ------------------------------------------------------------------ main loop
let last = performance.now(), hudAcc = 0, tabSig = "";
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  if (S && S.inGame && !paused) update(dt);
  if (subTimer > 0) { subTimer -= dt; if (subTimer <= 0) $("#sub").textContent = ""; }
  if (!$("#ending").hidden && endingEra) drawConsole($("#endScene").getContext("2d"), t, endingEra);
  else if ($("#menu").hidden) { (DRAW[station] || drawConsole)(g, t, day().era); }
  else drawConsole($("#menuBg").getContext("2d"), t, "1970s");
  hudAcc += dt;
  if (hudAcc > .25) { hudAcc = 0; hud(); const sig = STATIONS.map(([id]) => +pendingFor(id)).join("") + station; if (sig !== tabSig) { tabSig = sig; renderTabs(); } }
  if (dirty && S) { dirty = false; renderPanel(); renderTabs(); hud(); }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ swipe between stations
let sx = null;
$("#sceneWrap").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("#sceneWrap").addEventListener("touchend", e => { if (sx == null || !S) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) < 40) return; const i = STATIONS.findIndex(s => s[0] === station); const j = clamp(i + (dx > 0 ? -1 : 1), 0, STATIONS.length - 1); go(STATIONS[j][0]); });
document.addEventListener("keydown", e => {
  if (!S || !S.inGame) return;
  if (S.crisis && ["1", "2", "3"].includes(e.key)) { resolveCrisis(+e.key - 1); return; }
  const i = STATIONS.findIndex(s => s[0] === station);
  if (e.key === "a" || e.key === "ArrowLeft") go(STATIONS[Math.max(0, i - 1)][0]);
  if (e.key === "d" || e.key === "ArrowRight") go(STATIONS[Math.min(4, i + 1)][0]);
});

// ------------------------------------------------------------------ menu, pause, settings, achievements
function openMenu() {
  paused = true; setHum(false); hideLayer(); $("#menu").hidden = false;
  const sv = store.get("gc_save", null); $("#bCont").disabled = !sv; $("#bCont").textContent = sv ? `CONTINUE (SHIFT ${sv.day + 1})` : "CONTINUE";
}
function showAch(back) {
  showLayer(`<div class="h">Achievements ${Object.keys(unlocked).filter(k => ACH.some(a => a.id === k)).length} / ${ACH.length}</div>` +
    ACH.map(a => `<div class="ach ${unlocked[a.id] ? "on" : ""}"><div class="ic">${unlocked[a.id] ? esc(a.icon) : "??"}</div><div><div class="n">${esc(a.title)}</div><div>${esc(a.description)}</div></div></div>`).join("") + `<button id="lBack">BACK</button>`, null);
  $("#lBack").onclick = () => { sfx("ui_click"); back(); };
}
function showSettings(back) {
  const row = (k, n) => `<button class="chk" data-set="${k}"><span>${n}</span><span>${settings[k] ? "[ON]" : "[OFF]"}</span></button>`;
  showLayer(`<div class="h">Settings</div>${row("sound", "SOUND")}${row("crt", "CRT SCANLINES")}<button id="lReset">RESET ACHIEVEMENTS</button><button id="lBack">BACK</button>`, null);
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { settings[b.dataset.set] = !settings[b.dataset.set]; store.set("gc_settings", settings); applySettings(); sfx("switch"); showSettings(back); });
  $("#lReset").onclick = () => { if ($("#lReset").dataset.arm) { unlocked = {}; store.set("gc_ach", unlocked); $("#lReset").textContent = "ACHIEVEMENTS CLEARED"; } else { $("#lReset").dataset.arm = 1; $("#lReset").textContent = "TAP AGAIN TO CONFIRM"; } };
  $("#lBack").onclick = () => { sfx("ui_click"); back(); };
}
function applySettings() { $("#app").classList.toggle("crt", settings.crt); if (!settings.sound) setHum(false); else if (S?.inGame && !paused) setHum(true); }
function pauseMenu() {
  if (!S || !S.inGame) return; paused = true; setHum(false); $("#crisis").hidden = true;
  showLayer(`<div class="title" style="font-size:22px">PAUSED</div><button id="pRes">RESUME</button><button id="pAch">ACHIEVEMENTS</button><button id="pSet">SETTINGS</button><button id="pQuit">QUIT TO MENU</button><div class="muted">Progress is saved at the start of every shift.</div>`, null);
  $("#pRes").onclick = () => { sfx("ui_click"); hideLayer(); paused = false; setHum(true); if (S.crisis) $("#crisis").hidden = false; };
  $("#pAch").onclick = () => showAch(pauseMenu); $("#pSet").onclick = () => showSettings(pauseMenu);
  $("#pQuit").onclick = () => { sfx("ui_click"); S.inGame = false; $("#crisis").hidden = true; openMenu(); };
}
$("#pauseBtn").onclick = () => { sfx("ui_click"); pauseMenu(); };
$("#bNew").onclick = () => { audio(); sfx("ui_click"); if (store.get("gc_save", null) && !$("#bNew").dataset.arm) { $("#bNew").dataset.arm = 1; $("#bNew").textContent = "TAP AGAIN — PROGRESS WILL RESET"; return; } delete $("#bNew").dataset.arm; $("#bNew").textContent = "NEW GAME"; newGame(); };
$("#bCont").onclick = () => { audio(); sfx("ui_click"); const sv = store.get("gc_save", null); if (!sv) return; loadSnap(sv); startDay(); };
$("#bAch").onclick = () => { sfx("ui_click"); $("#menu").hidden = true; showAch(() => { hideLayer(); openMenu(); }); };
$("#bSet").onclick = () => { audio(); sfx("ui_click"); $("#menu").hidden = true; showSettings(() => { hideLayer(); openMenu(); }); };
document.addEventListener("visibilitychange", () => { if (document.hidden && S?.inGame && !paused) pauseMenu(); });

S = freshState(); applySettings(); openMenu(); requestAnimationFrame(frame);
</script>
