<title>Ground Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen mobile app — status bar, pixel scene (16:9), station panel (scrolls), station tabs. */
:root {
  /* Desk & paper: muted 1971 office — wood desk, cream paper, ink, rubber-stamp red, olive approval green */
  --bg: #2e2820; --deep: #1f1a15; --panel: #3a3229; --line: #5a4e3e;
  --cyan: #a9cbbf; --violet: #b8a2d6; --green: #a3c48d; --amber: #e3b45c; --red: #c4493d;
  --text: #ece2c6; --dim: #a1957a; --paper: #e4d9bb; --paper-2: #d4c7a3; --ink: #2a241d;
  --stamp-red: #a8322b; --stamp-green: #4f6e3a; --metal: #6d675c;
  --f-ui: "VT323", "Courier New", ui-monospace, monospace;
  --f-title: "Pixelify Sans", "VT323", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--deep); color: var(--text); font-family: var(--f-ui); font-size: 20px; line-height: 1.15; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: var(--f-ui); font-size: 20px; color: var(--cyan); background: var(--bg); border: 2px solid #26607a; padding: 7px 10px; cursor: pointer; text-align: left; border-radius: 0; }
button:active { background: #134055; color: #fff; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
button:disabled { color: var(--dim); border-color: #243049; background: var(--deep); }
#app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* status bar */
#top { display: flex; align-items: center; gap: 10px; padding-block: 8px 6px; border-bottom: 2px solid var(--line); }
#clock { color: var(--cyan); font-size: 21px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#clock.hold { color: var(--amber); }
.meter { display: grid; grid-template-columns: auto 54px; gap: 1px 5px; align-items: center; font-size: 17px; }
.meter i { display: block; height: 7px; background: var(--deep); border: 1px solid var(--line); position: relative; }
.meter i b { position: absolute; inset: 0 auto 0 0; }
#pauseBtn { padding: 2px 10px; font-size: 20px; }

/* scene */
#sceneWrap { position: relative; flex: none; }
#app.slim #scene { display: none; }
#app.slim #sceneWrap { height: auto; }
#app.slim #sub { display: none; }
#app.slim #notes { position: static; padding: 4px 16px 0; }
#app.slim #notes div { animation-duration: 3s; }
.lbl { font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sec { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.hint { color: var(--text); font-size: 18px; }
button.big { text-align: center; font-size: 22px; padding: 10px; }
button.big.att { border-color: var(--amber); color: var(--amber); }
.sysrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sysrow button { text-align: center; padding: 6px 2px; font-size: 18px; line-height: 1; color: var(--dim); }
.sysrow button small { font-size: 15px; }
.sysrow button.on { color: var(--amber); border-color: var(--amber); }
.trust { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; color: var(--violet); font-size: 17px; }
.screen { flex: none; border: 3px solid #2b4a3c; background: #000; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
.screen.amber { border-color: #5a4316; }
.screen .lbl { color: #3aa877; font-size: 15px; }
#scene { display: block; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
.crt #sceneWrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
#notes { position: absolute; left: 8px; top: 6px; right: 8px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
#notes div { font-size: 17px; text-shadow: 0 0 2px #000, 1px 1px 0 #000; animation: noteFade 5s forwards; }
@keyframes noteFade { 0%,80% { opacity: 1 } 100% { opacity: 0 } }
#sub { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 18px; color: var(--green); text-shadow: 1px 1px 0 #000, 0 0 3px #000; text-align: center; pointer-events: none; }

/* station panel */
#panel { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-block: 10px 14px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.h { color: var(--cyan); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.box { border: 2px solid var(--line); background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.box > .lbl { font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > button { flex: 1 1 40%; }
.log { max-height: 42vh; border: 2px solid var(--line); background: var(--panel); padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 19px; }
.log p { margin: 0; }
.log p.new { animation: lineIn .5s steps(6); }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px) } }
.sp-MIA { color: var(--green); } .sp-YOU { color: var(--cyan); } .sp-LOOP { color: var(--violet); } .sp-other { color: var(--amber); }
.choice { width: 100%; color: var(--cyan); }
.choice::before { content: "> "; color: var(--amber); }
.sys.on { border-color: var(--amber); color: var(--amber); }
.bar { height: 10px; background: var(--deep); border: 1px solid var(--line); position: relative; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--violet); }
.muted { color: var(--dim); font-size: 17px; }
.mia { color: var(--amber); }
canvas.map, canvas.cam { width: 100%; display: block; image-rendering: pixelated; touch-action: manipulation; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.ls { display: grid; grid-template-columns: 34px 1fr 44px; gap: 3px 6px; align-items: center; font-size: 17px; color: var(--green); }
.ls i { height: 8px; background: #02150c; border: 1px solid #12432d; position: relative; } .ls i b { position: absolute; inset: 0 auto 0 0; background: var(--green); }
.manual { color: var(--green); font-size: 18px; }
.manual .done { color: #2f7a57; text-decoration: line-through; }
.manual .next { color: #fff; }

/* board */
.cork { position: relative; flex: none; min-height: clamp(300px, 46vh, 480px); background: #8a5a32; background-image: radial-gradient(#6b4325 1px, transparent 1.5px), radial-gradient(#a36c3e 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; border: 6px solid #2a1c12; padding: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; align-content: start; }
.card { position: relative; background: #efe9d8; color: var(--ink); padding: 9px 5px 5px; font-size: 16px; line-height: 1.05; min-height: 58px; box-shadow: 2px 3px 0 rgba(0,0,0,.35); border-top: 5px solid var(--k, #3fe0ff); cursor: pointer; z-index: 1; }
.card::before { content: ""; position: absolute; top: -8px; left: 50%; width: 8px; height: 8px; margin-left: -4px; background: #c0392b; border-radius: 50%; box-shadow: 1px 1px 0 #000; }
.card small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; margin-bottom: 2px; }
.card.sel { outline: 3px solid var(--cyan); }
.card.ded { background: #ffe1e1; }
.card.flash-ok { animation: fok 1s; } .card.flash-bad { animation: fbad .6s; }
@keyframes fok { 0%,60% { outline: 4px solid var(--green) } }
@keyframes fbad { 0%,30%,60% { transform: translateX(-3px); outline: 3px solid var(--red) } 15%,45% { transform: translateX(3px) } }
.strings { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.inbox { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 4px; }
.inbox .card { flex: 0 0 31%; }
.detail { border-color: #3a5a7a; }
.detail .t { color: var(--cyan); }

/* fax & window */
.paper { background: var(--paper); color: var(--ink); border: 2px solid #b9ae90; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.paper .from { font-size: 16px; color: #5a4a30; }
.paper .t { font-size: 24px; font-weight: bold; }
.paper button { color: var(--ink); background: #f8f3e3; border-color: #8c826a; }
.faxlist { display: flex; gap: 6px; flex-wrap: wrap; }
.faxlist button { flex: 0 1 auto; font-size: 17px; padding: 4px 8px; }
.faxlist button.cur { border-color: var(--amber); color: var(--amber); }

/* tabs */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs button { border: 0; border-right: 1px solid var(--line); background: var(--deep); color: var(--dim); text-align: center; font-size: 17px; padding: 10px 2px 8px; position: relative; }
#tabs button:last-child { border-right: 0; }
#tabs button.cur { color: var(--cyan); background: var(--bg); box-shadow: inset 0 3px 0 var(--cyan); }
#tabs button.att::after { content: ""; position: absolute; top: 5px; right: 8px; width: 7px; height: 7px; background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0 } }

/* full-screen layers */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(3,6,12,.94); text-align: center; padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.layer .inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.layer button { text-align: center; font-size: 22px; padding: 10px; }
.title { font-family: var(--f-title); color: var(--cyan); font-size: clamp(22px, 7.4vw, 40px); line-height: 1.25; text-shadow: 0 0 8px rgba(63,224,255,.7), 0 0 22px rgba(63,224,255,.35); animation: glow 3s ease-in-out infinite; text-wrap: balance; }
@keyframes glow { 50% { text-shadow: 0 0 4px rgba(63,224,255,.5), 0 0 12px rgba(63,224,255,.2) } }
.subtitle { color: var(--violet); font-size: 26px; letter-spacing: .25em; }
#menuBg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; filter: blur(3px) brightness(.45); z-index: -1; }
#menu { background: #03060c; isolation: isolate; }
.date { font-family: var(--f-title); font-size: clamp(16px, 4.8vw, 24px); color: var(--cyan); line-height: 1.4; }
.intro-body { font-size: 22px; line-height: 1.3; text-wrap: pretty; }
.pulse { animation: blink 1.2s steps(2) infinite; color: var(--dim); }
.report { background: var(--paper); color: var(--ink); text-align: left; padding: 14px; border: 2px solid #b9ae90; display: grid; gap: 10px; }
.report .stats { font-size: 19px; white-space: pre; overflow-x: auto; font-variant-numeric: tabular-nums; }
.grade { font-family: var(--f-title); font-size: 46px; color: #8a2c24; }
.ach { display: flex; gap: 10px; align-items: center; text-align: left; border: 2px solid #2a3140; padding: 8px; background: #0b0f18; color: #59627a; }
.ach .ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: #1f2533; font-family: var(--f-title); font-size: 13px; }
.ach.on { border-color: var(--cyan); color: var(--text); background: #0e2333; box-shadow: 0 0 10px rgba(63,224,255,.35); }
.ach.on .ic { background: var(--cyan); color: var(--bg); }
.ach .n { font-size: 21px; } .ach.on .n { color: var(--cyan); }
#crisis { background: rgba(30,2,6,.9); }
#crisis .inner { border: 3px solid var(--red); background: #1a0306; padding: 14px; animation: cr 1s steps(2) infinite; box-shadow: 0 0 18px rgba(255,90,95,.35); }
@keyframes cr { 50% { border-color: #7a2328 } }
#crisis .ct { font-family: var(--f-title); font-size: 15px; color: var(--red); line-height: 1.4; }
#crisis .bar b { background: var(--red); }
#crisis button { text-align: left; font-size: 20px; }
#toast { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 40; display: flex; gap: 10px; align-items: center; background: var(--bg); border: 2px solid var(--cyan); box-shadow: 0 0 14px rgba(63,224,255,.4); padding: 8px 12px 8px 8px; transform: translateX(130%); transition: transform .35s; max-width: calc(100% - 20px); }
#toast.show { transform: none; }
#toast .ic { width: 40px; height: 40px; display: grid; place-items: center; background: var(--cyan); color: var(--bg); font-family: var(--f-title); font-size: 12px; flex: none; }
#ending { background: #000; z-index: 30; }
#ending .big { font-family: var(--f-title); color: var(--cyan); font-size: clamp(20px, 6.5vw, 36px); line-height: 1.35; text-shadow: 0 0 12px rgba(63,224,255,.6); min-height: 1.4em; }
#ending .small { color: var(--violet); font-size: 24px; min-height: 1.2em; }
#ending .cap { color: var(--green); font-size: 22px; min-height: 2.6em; }
#ending canvas { width: 100%; max-width: 520px; image-rendering: pixelated; opacity: 0; transition: opacity 2s; }
.chk { display: flex; justify-content: space-between; align-items: center; }

/* ================= desk-and-paper skin ================= */
body { background: var(--deep); }
#app { background: var(--bg) repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px), repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 23px); }
#top { background: var(--metal); border-bottom: 4px solid #2a251f; box-shadow: inset 0 2px 0 #8a8476; }
#clock { font-family: var(--f-title); font-size: 15px; color: #f1e8cc; text-shadow: 1px 1px 0 #2a251f; }
#clock.hold { color: #ffd27a; }
.meter { color: #f1e8cc; } .meter i { background: #2a251f; border-color: #2a251f; }
#scene { filter: saturate(.55) sepia(.22) contrast(1.05); }
#sceneWrap { border-bottom: 4px solid #2a251f; }
button { font-family: var(--f-ui); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 3px 0 rgba(0,0,0,.45); }
button:active { background: var(--paper-2); color: var(--ink); transform: translate(2px, 2px); box-shadow: none; }

.h, .lbl { font-family: var(--f-title); letter-spacing: .04em; }
.lbl { font-size: 12px; color: #c9bd9c; }
.hint { color: var(--text); }
.mia { color: #f3c972; }
.muted { color: var(--dim); }
/* teletype printout for the radio log */
.log { background: var(--paper) repeating-linear-gradient(0deg, transparent 0 21px, rgba(120,90,40,.16) 21px 22px); color: var(--ink); border: 0; box-shadow: 3px 4px 0 rgba(0,0,0,.4); padding: 10px 12px; position: relative; }
.log::before { content: "TELETYPE · S-BAND LOOP"; display: block; font-family: var(--f-title); font-size: 11px; color: #8a7a55; margin-bottom: 4px; }
.sp-MIA { color: #2f5d3a; } .sp-YOU { color: #2b3f6e; } .sp-LOOP { color: #6a3d72; } .sp-other { color: #7c4a17; }
.log p { color: var(--ink); }
.choice { background: #efe6cc; color: var(--ink); text-align: left; }
.choice::before { color: var(--stamp-red); }
button.big { font-family: var(--f-title); font-size: 15px; }
button.big.att { background: #f1d9a0; border-color: var(--stamp-red); color: var(--stamp-red); animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: rotate(-1deg) } }
.sec { border-top: 2px dashed #5a4e3e; }
/* system switches on a metal plate */
.sysrow { background: var(--metal); padding: 8px; box-shadow: inset 0 2px 0 #8a8476, 2px 3px 0 rgba(0,0,0,.4); }
.sysrow button { background: #3b372f; color: #9a9384; border-color: #22201b; box-shadow: inset 0 -4px 0 #22201b; font-family: var(--f-title); font-size: 11px; }
.sysrow button small { font-family: var(--f-ui); font-size: 16px; }
.sysrow button.on { background: #cfa04a; color: var(--ink); border-color: #22201b; box-shadow: inset 0 4px 0 #8f6a26; }
.trust { color: #e3cf97; } .trust .bar { background: #2a251f; border-color: #2a251f; } .trust .bar b { background: #b8873a; }
/* monitors in beige plastic bezels */
.screen { border: 10px solid #b6ab8b; border-radius: 6px; box-shadow: inset 0 0 0 2px #2a251f, 3px 4px 0 rgba(0,0,0,.45); background: #050806; }
.screen.amber { border-color: #b6ab8b; }
.screen .lbl { color: #6fae86; font-family: var(--f-ui); font-size: 15px; }
.manual { background: var(--paper); color: var(--ink); padding: 8px 10px; box-shadow: 3px 4px 0 rgba(0,0,0,.4); }
.manual .done { color: #8a7f68; } .manual .next { color: var(--stamp-red); }
/* board */
.cork { box-shadow: 3px 4px 0 rgba(0,0,0,.45); }
/* window & fax */
.box { background: var(--paper); color: var(--ink); border: 0; box-shadow: 3px 4px 0 rgba(0,0,0,.4); }
.box .muted { color: #7b715d; }
.paper { box-shadow: 3px 4px 0 rgba(0,0,0,.45); border: 0; transform: rotate(-.4deg); position: relative; }
.paper .t { font-family: var(--f-title); font-size: 19px; }
.faxlist button { background: var(--paper-2); }
.faxlist button.cur { background: var(--paper); color: var(--stamp-red); border-color: var(--stamp-red); }
.stamp { font-family: var(--f-title); font-size: 15px; text-transform: uppercase; background: transparent; box-shadow: none; border: 3px solid currentColor; padding: 6px 10px; transform: rotate(-4deg); text-align: center; }
.stamp.s1 { color: var(--stamp-green); } .stamp.s2 { color: var(--stamp-red); transform: rotate(3deg); }
.stamp:active { background: rgba(0,0,0,.06); }
.stampmark { position: absolute; right: 10px; top: 14px; font-family: var(--f-title); font-size: 18px; color: var(--stamp-red); border: 3px solid currentColor; padding: 4px 8px; transform: rotate(-12deg); opacity: .8; mix-blend-mode: multiply; pointer-events: none; max-width: 60%; text-align: center; }
.stampmark.ok { color: var(--stamp-green); }
.stampmark.new { animation: thunk .35s ease-out; }
@keyframes thunk { from { transform: rotate(-12deg) scale(1.8); opacity: 0 } }
/* drawer tabs */
#tabs { background: #241f19; border-top: 4px solid #2a251f; gap: 3px; padding-inline: 3px; }
#tabs button { background: #8b7c5d; color: #2a241d; border: 2px solid #2a241d; border-bottom: 0; box-shadow: none; font-family: var(--f-title); font-size: 10px; padding: 12px 1px 10px; margin-top: 5px; }
#tabs button.cur { background: var(--paper); color: var(--stamp-red); box-shadow: none; margin-top: 0; }
#tabs button.att::after { background: var(--stamp-red); }
/* full-screen layers: documents on the desk */
.layer { background: rgba(31,26,21,.96) repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 9px); }
.layer .inner { background: var(--paper); color: var(--ink); padding: 18px 16px; box-shadow: 4px 6px 0 rgba(0,0,0,.5); transform: rotate(-.3deg); }
.layer .inner .muted { color: #7b715d; }
.layer .h { color: var(--ink); }
#menu .inner { gap: 10px; }
.title { font-family: var(--f-title); font-weight: 700; color: var(--ink); text-shadow: 2px 2px 0 rgba(168,50,43,.35); animation: none; font-size: clamp(30px, 10vw, 52px); line-height: 1; letter-spacing: .02em; }
.subtitle { color: var(--stamp-red); font-family: var(--f-title); font-size: 18px; }
.date { font-family: var(--f-title); color: var(--ink); }
.intro-body { color: var(--ink); }
.pulse { color: var(--stamp-red); font-family: var(--f-title); font-size: 13px; }
.report { box-shadow: none; border: 0; padding: 0; background: transparent; position: relative; }
.report b { font-family: var(--f-title); font-size: 14px; }
.grade { font-family: var(--f-title); color: var(--stamp-red); border: 4px solid currentColor; padding: 2px 12px; transform: rotate(-10deg); mix-blend-mode: multiply; }
.ach { background: #d4c7a3; border-color: #a99b78; color: #7b715d; box-shadow: 2px 3px 0 rgba(0,0,0,.25); }
.ach .ic { background: #a99b78; color: var(--paper); font-family: var(--f-title); }
.ach.on { background: var(--paper); border-color: var(--stamp-green); color: var(--ink); box-shadow: 2px 3px 0 rgba(0,0,0,.3); }
.ach.on .ic { background: var(--stamp-green); color: var(--paper); }
.ach .n, .ach.on .n { color: var(--ink); font-family: var(--f-title); font-size: 15px; }
.chk { color: var(--ink); }
#crisis { background: rgba(31,10,8,.9); }
#crisis .inner { background: #efe0c4; border: 4px double var(--stamp-red); box-shadow: 4px 6px 0 rgba(0,0,0,.5); animation: shake .5s steps(2) infinite; }

<script>
"use strict";
const DATA = __DATA__;

// ------------------------------------------------------------------ utils
const $ = s => document.querySelector(s);
const list = v => v == null ? [] : Array.isArray(v) ? v : [v];
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const settings = Object.assign({ sound: true, crt: true }, store.get("gc_settings", {}));

// ------------------------------------------------------------------ audio (WebAudio placeholders)
const SFX = {
  ui_click: [[1400], .03, "square", .08], radio_beep: [[880, 1320], .22, "sine", .2], radio_static: [[0], .3, "noise", .06],
  alarm: [[660, 440, 660, 440], .9, "square", .12], phone_ring: [[1150, 1400, 1150, 1400], .8, "sine", .15], knock: [[140, 1, 140], .3, "sine", .4],
  switch: [[0], .04, "noise", .2], card_pin: [[220], .06, "sine", .3], string_ok: [[523, 784, 1046], .35, "sine", .2], string_fail: [[220, 155], .35, "square", .1],
  achievement: [[523, 659, 784, 1046], .6, "square", .1], crisis_ok: [[660, 990], .3, "sine", .2], crisis_fail: [[300, 200, 150], .5, "square", .1],
  nav_ok: [[700, 1050], .25, "sine", .2], nav_fail: [[260], .25, "square", .1], signal: [[110, 220, 165, 110], 1.6, "sine", .25], paper: [[0], .18, "noise", .08], fax: [[0], .5, "noise", .05],
};
let actx = null, hum = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function sfx(n) {
  if (!settings.sound) return;
  const a = audio(); if (!a) return;
  try {
    const [fr, dur, wave, vol] = SFX[n] || SFX.ui_click, t0 = a.currentTime, g = a.createGain();
    g.connect(a.destination); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .005);
    g.gain.setValueAtTime(vol, t0 + dur * .7); g.gain.linearRampToValueAtTime(0, t0 + dur);
    if (wave === "noise") {
      const b = a.createBuffer(1, Math.max(1, a.sampleRate * dur | 0), a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = a.createBufferSource(); s.buffer = b; s.connect(g); s.start(t0);
    } else {
      const o = a.createOscillator(); o.type = wave; const seg = dur / fr.length;
      fr.forEach((f, i) => o.frequency.setValueAtTime(f || 1, t0 + i * seg));
      o.connect(g); o.start(t0); o.stop(t0 + dur + .05);
    }
  } catch (e) {}
}
function setHum(on) {
  const a = audio(); if (!a) return;
  try {
    if (on && settings.sound && !hum) {
      const g = a.createGain(); g.gain.value = .025; g.connect(a.destination);
      const o1 = a.createOscillator(); o1.frequency.value = 55; o1.connect(g); o1.start();
      const o2 = a.createOscillator(); o2.frequency.value = 110; const g2 = a.createGain(); g2.gain.value = .3; o2.connect(g2); g2.connect(g); o2.start();
      hum = { g, o1, o2 };
    } else if ((!on || !settings.sound) && hum) { hum.o1.stop(); hum.o2.stop(); hum.g.disconnect(); hum = null; }
  } catch (e) {}
}

// ------------------------------------------------------------------ data indexes
const DAYS = DATA.days.days, CARDS = DATA.cards.cards, DEDS = DATA.deductions.deductions, DLG = DATA.dialogues.dialogues;
const IDLE = DATA.dialogues.idle, EV = DATA.events, MIS = DATA.missions, ACH = DATA.achievements.achievements;
const TPL = {}; MIS.templates.forEach(t => TPL[t.id] = t);
const MAPW = MIS.map.width, MAPH = MIS.map.height, HOME = { x: MIS.map.home[0], y: MIS.map.home[1] };
const STATIONS = [["board", "BOARD"], ["monitors", "SCREENS"], ["console", "RADIO"], ["window", "WINDOW"], ["phone", "FAX"]];
const RATES = { o2: .045, pw: .02, sys: { heat: .035, lights: .015, rover: .025, cam: .015 }, cold: 10, coldMul: 1.3, darkMul: 2, tTarget: 21, tRise: .08, tDrop: .06, tMin: -5 };
const SYSNAME = { heat: "HEATING", lights: "HAB LIGHTS", rover: "ROVER", cam: "HELMET CAM" };

// ------------------------------------------------------------------ state
let S;
function freshState() {
  return { day: 0, trust: 50, flags: {}, ending: "", inGame: false, fired: {}, stats: {},
    time: 0, shift: 600, cStart: 1200, cSpan: 480, hold: false,
    o2: 100, pw: 100, temp: 21, sys: { heat: true, lights: true, rover: true, cam: true }, wasted: 0, warned: {},
    discovered: [], pinned: [], links: [], deds: [], dyn: {}, failed: [], fullWall: false,
    queue: [], dlg: null, log: [],
    schedule: [], faxInbox: [], faxArchive: [], visitor: null, visitorQ: [], crisis: null, delays: [],
    mission: null, pending: [], mia: { ...HOME }, landmarks: [], mcount: 0 };
}
let unlocked = store.get("gc_ach", {});
let station = "console", paused = true, selCard = null, faxShown = null, subTimer = 0, dirty = true;

// ------------------------------------------------------------------ events / achievements / triggers
function valEq(a, b) { return typeof a === "number" && typeof b === "number" ? Math.abs(a - b) < 1e-6 : a === b; }
function matches(tr, name, data) {
  if (tr.on !== name) return false;
  for (const [k, v] of Object.entries(tr.match || {})) {
    if (k.startsWith("min_")) { if (!((data[k.slice(4)] ?? -Infinity) >= v)) return false; }
    else if (k.startsWith("max_")) { if (!((data[k.slice(4)] ?? Infinity) <= v)) return false; }
    else if (!valEq(data[k], v)) return false;
  }
  return true;
}
function emit(name, data = {}) {
  ACH.forEach(a => { if (!unlocked[a.id] && matches(a.trigger, name, data)) unlock(a.id); });
  if (S && S.inGame) (day().triggers || []).forEach((tr, i) => {
    const key = tr.id || "t" + i;
    if (tr.once !== false && S.fired[key]) return;
    if (!matches(tr, name, data) || !cond(tr.if)) return;
    S.fired[key] = true; apply(tr.effects);
  });
}
const toastQ = []; let toasting = false;
function unlock(id) {
  if (unlocked[id]) return; const a = ACH.find(x => x.id === id); if (!a) return;
  unlocked[id] = Date.now(); store.set("gc_ach", unlocked); toastQ.push(a); if (!toasting) nextToast();
}
function nextToast() {
  const a = toastQ.shift(); if (!a) { toasting = false; return; }
  toasting = true; $("#tIc").textContent = a.icon; $("#tTx").textContent = a.title; sfx("achievement");
  $("#toast").classList.add("show");
  setTimeout(() => { $("#toast").classList.remove("show"); setTimeout(nextToast, 450); }, 3200);
}
function note(text, kind = "info") {
  const c = { info: "var(--cyan)", card: "var(--violet)", alert: "var(--amber)", story: "var(--green)", radio: "var(--green)" }[kind] || "var(--cyan)";
  const d = document.createElement("div"); d.style.color = c; d.textContent = text;
  const n = $("#notes"); n.appendChild(d); while (n.children.length > 4) n.firstChild.remove();
  setTimeout(() => d.remove(), 5200);
}
function sub(speaker, text) { const s = $("#sub"); s.textContent = speaker + ": " + text; s.style.color = speaker === "YOU" ? "var(--cyan)" : speaker === "LOOP" ? "var(--violet)" : "var(--green)"; subTimer = clamp(2 + text.length * .05, 3, 9); }

// ------------------------------------------------------------------ effects & conditions
function cond(c) {
  if (c == null) return true;
  if (Array.isArray(c)) return c.every(cond);
  for (const [k, v] of Object.entries(c)) {
    const L = list(v);
    if (k === "flag" && !L.every(f => S.flags[f])) return false;
    if (k === "not_flag" && L.some(f => S.flags[f])) return false;
    if (k === "min_trust" && S.trust < v) return false;
    if (k === "max_trust" && S.trust > v) return false;
    if (k === "card" && !L.every(x => S.discovered.includes(x))) return false;
    if (k === "deduction" && !L.every(x => S.deds.includes(x))) return false;
    if (k === "no_deduction" && L.some(x => S.deds.includes(x))) return false;
    if (k === "min_day" && S.day + 1 < v) return false;
    if (k === "any" && !L.some(cond)) return false;
  }
  return true;
}
function apply(effects) { list(effects).forEach(e => { if (e && (!("if" in e) || cond(e.if))) applyOne(e); }); dirty = true; }
function applyOne(e) {
  switch (e.type) {
    case "trust": trust(e.value | 0); break;
    case "flag": setFlag(e.name, e.value ?? true); break;
    case "card": discover(e.id); break;
    case "dialogue": queueDlg(e.id); break;
    case "say": say(e.speaker || "MIA", e.text); break;
    case "fax": queueFax(e.id); break;
    case "visitor": showVisitor(e.id); break;
    case "crisis": startCrisis(e.id); break;
    case "mission": queueMission(e.template || "random", e.params || {}); break;
    case "oxygen": changeO2(+e.value || 0, !!e.waste); break;
    case "power": S.pw = clamp(S.pw + (+e.value || 0), 0, 100); break;
    case "system": setSys(e.name, e.value !== false); break;
    case "time": penalty(+e.minutes || 0); break;
    case "achievement": unlock(e.id); break;
    case "notify": note(e.text, e.kind || "info"); break;
    case "event": emit(e.name, e.data || {}); break;
    case "stat": stat(e.name, e.value ?? 1); break;
    case "sound": sfx(e.name); break;
    case "ending": S.ending = e.id || "signal_acquired"; break;
    case "end_day": setTimeout(() => finishDay(false), 0); break;
    case "delay": S.delays.push({ t: +e.seconds || 1, effects: e.effects }); break;
  }
}
function trust(d) { if (!d) return; S.trust = clamp(S.trust + d, 0, 100); emit("trust_changed", { value: S.trust, delta: d }); }
function setFlag(n, v) { S.flags[n] = v; emit("flag_set", { flag: n, value: v }); }
function stat(n, v = 1) { S.stats[n] = (S.stats[n] || 0) + v; }
const day = () => DAYS[S.day] || {};

// ------------------------------------------------------------------ time & resources
function clockStr() { const m = (S.cStart + Math.floor(prog() * S.cSpan)) % 1440; return String(m / 60 | 0).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
const prog = () => clamp(S.time / S.shift, 0, 1);
function penalty(min) { if (!S.inGame || min <= 0) return; S.time = Math.min(S.time + min / S.cSpan * S.shift, S.shift * .96); note("-" + (min | 0) + " MIN", "alert"); }
function pendingStory() { return !!S.dlg || S.queue.length > 0 || S.faxInbox.some(f => EV.faxes[f]?.required) || (S.mission && S.mission.story) || S.pending.some(m => m.story); }
function changeO2(v, waste) { S.o2 = clamp(S.o2 + v, 0, 100); if (waste && v < 0) { S.wasted += -v; note("O2 LOST " + (-v).toFixed(1) + "%", "alert"); } }
function powerDraw() { let p = RATES.pw; for (const k in S.sys) if (S.sys[k]) p += RATES.sys[k]; return p; }
function setSys(n, on) {
  if (!(n in S.sys)) return;
  if (on && S.pw <= 0) { note("NO POWER — " + SYSNAME[n] + " CANNOT START", "alert"); on = false; }
  if (S.sys[n] === on) return; S.sys[n] = on; emit("system_toggled", { system: n, on }); dirty = true;
}
function warnOnce(k, c, t) { if (c && !S.warned[k]) { S.warned[k] = 1; note(t, "alert"); sfx("alarm"); } }

function update(dt) {
  // clock
  if (prog() >= .96 && pendingStory()) S.hold = true;
  else { S.hold = false; S.time += dt; }
  // schedule
  const p = prog();
  while (S.schedule.length && S.schedule[0].at <= p) { const e = S.schedule.shift(); if (cond(e.if)) apply(e.effects); }
  // delayed effects
  for (const d of S.delays.slice()) { d.t -= dt; if (d.t <= 0) { S.delays.splice(S.delays.indexOf(d), 1); if (S.inGame) apply(d.effects); } }
  // resources
  let drain = RATES.o2; if (S.temp < RATES.cold) drain *= RATES.coldMul; if (S.pw <= 0) drain *= RATES.darkMul;
  S.o2 = Math.max(0, S.o2 - drain * dt); S.pw = Math.max(0, S.pw - powerDraw() * dt);
  if (S.pw <= 0 && Object.values(S.sys).some(Boolean)) { for (const k in S.sys) S.sys[k] = false; note("POWER DEPLETED — ALL SYSTEMS OFFLINE", "alert"); sfx("alarm"); dirty = true; }
  const tgt = S.sys.heat && S.pw > 0 ? RATES.tTarget : RATES.tMin, rate = S.sys.heat && S.pw > 0 ? RATES.tRise : RATES.tDrop;
  S.temp += clamp(tgt - S.temp, -rate * dt, rate * dt);
  warnOnce("o2a", S.o2 < 25, "OXYGEN BELOW 25%"); warnOnce("o2b", S.o2 < 10, "OXYGEN CRITICAL");
  warnOnce("pw", S.pw < 20, "POWER BELOW 20% — SHUT DOWN SYSTEMS"); warnOnce("cold", S.temp < RATES.cold, "HABITAT IS GETTING COLD");
  if (S.o2 <= 0 && !S.warned.dead) { S.warned.dead = 1; note("OXYGEN CRITICAL — SHIFT ABORTED", "alert"); finishDay(true); return; }
  // mission travel
  const m = S.mission;
  if (m && m.state === "travel") { m.tt += dt / m.travelTime; if (m.tt >= 1) { S.mia = { ...m.target }; finishMission(true); } }
  // crisis timer
  if (S.crisis) { S.crisis.left -= dt; if (S.crisis.left <= 0) resolveCrisis(-1); }
  if (S.time >= S.shift && S.inGame) finishDay(false);
}

// ------------------------------------------------------------------ board
function card(id) { return S.dyn[id] || CARDS[id] || { title: id, type: "report", text: "" }; }
function discover(id) {
  if (!id || S.discovered.includes(id) || !(CARDS[id] || S.dyn[id])) return;
  S.discovered.push(id); stat("cards"); note("NEW CARD → BOARD: " + card(id).title, "card"); sfx("paper");
  emit("card_discovered", { id, type: card(id).type });
}
function pin(id) {
  if (S.pinned.includes(id)) return; S.pinned.push(id); sfx("card_pin"); emit("card_pinned", { id });
  if (!S.fullWall && Object.keys(CARDS).filter(k => !CARDS[k].optional).every(k => S.pinned.includes(k))) { S.fullWall = true; emit("board_full", {}); }
}
function linked(a, b) { return S.links.some(l => (l[0] === a && l[1] === b) || (l[0] === b && l[1] === a)); }
function tryLink(a, b) {
  if (linked(a, b)) { note("Those are already tied together.", "info"); return ""; }
  for (const d of DEDS) {
    const [x, y] = d.cards;
    if (!((x === a && y === b) || (x === b && y === a))) continue;
    if (S.deds.includes(d.id) || !cond(d.if)) continue;
    S.deds.push(d.id); S.links.push([a, b, d.id]);
    S.dyn[d.id] = { type: "deduction", title: d.title, text: d.text, optional: true };
    S.discovered.push(d.id); S.pinned.push(d.id); stat("deductions"); sfx("string_ok");
    note("DEDUCTION: " + d.title, "story"); emit("deduction_found", { id: d.id }); apply(d.effects);
    return d.id;
  }
  const key = [a, b].sort().join("|"); sfx("string_fail");
  if (!S.failed.includes(key)) { S.failed.push(key); stat("wrong_links"); penalty(DATA.deductions.wrong_link_penalty_minutes || 20); }
  note("THESE DON'T CONNECT", "alert"); return "";
}

// ------------------------------------------------------------------ dialogue
function log(sp, tx) { S.log.push({ sp, tx, n: 1 }); if (S.log.length > 150) S.log.shift(); }
function say(sp, tx) { if (!tx) return; log(sp, tx); sub(sp, tx); dirty = true; }
function queueDlg(id) {
  if (!DLG[id] || S.queue.includes(id) || (S.dlg && S.dlg.id === id)) return;
  S.queue.push(id); note("INCOMING TRANSMISSION — RADIO", "radio"); sfx("radio_beep");
}
function startDlg() {
  if (S.dlg || !S.queue.length) return; const id = S.queue.shift(); S.dlg = { id, node: null, choices: [] };
  sfx("radio_static"); gotoNode(DLG[id].start || "start");
}
function gotoNode(nid) {
  const d = DLG[S.dlg.id], n = d.nodes[nid]; if (!n) { endDlg(); return; }
  let text = n.text; for (const v of n.variants || []) if (cond(v.if)) { text = v.text; break; }
  const sp = n.speaker || d.speaker || "MIA";
  S.dlg.node = n; S.dlg.choices = (n.choices || []).filter(c => cond(c.if));
  say(sp, text); apply(n.effects);
}
function advanceDlg() { const n = S.dlg?.node; if (!n || S.dlg.choices.length) return; if (!n.next || n.end) endDlg(); else gotoNode(n.next); }
function chooseDlg(i) { const c = S.dlg?.choices[i]; if (!c) return; say("YOU", c.text); S.dlg.choices = []; apply(c.effects); if (c.next) gotoNode(c.next); else endDlg(); }
function endDlg() { const id = S.dlg.id; S.dlg = null; emit("dialogue_finished", { id }); dirty = true; if (station === "console" && S.queue.length) setTimeout(() => { if (station === "console" && !paused) { startDlg(); dirty = true; } }, 1200); }
function idleChat() { const b = S.trust < 35 ? "low" : S.trust >= 70 ? "high" : "mid"; say("YOU", "Selene, Ground. Radio check."); say("MIA", pick(IDLE[b])); }

// ------------------------------------------------------------------ events: crises, visitors, faxes
function startCrisis(id) {
  const c = EV.crises[id]; if (!c) return;
  if (S.crisis) { S.schedule.push({ at: prog() + .04, effects: [{ type: "crisis", id }] }); S.schedule.sort((a, b) => a.at - b.at); return; }
  const opts = c.options.slice().sort(() => Math.random() - .5);
  S.crisis = { id, c, opts, left: c.timer || 20, total: c.timer || 20 };
  sfx("alarm"); say("MIA", c.mia_line || "Ground, I've got a problem!"); emit("crisis_started", { id }); showCrisis();
}
function resolveCrisis(i) {
  const k = S.crisis; if (!k) return; S.crisis = null; let ok = false;
  if (i >= 0 && k.opts[i]) { ok = !!k.opts[i].correct; say("YOU", k.opts[i].text); apply(k.opts[i].effects); }
  if (ok) { stat("crises_ok"); sfx("crisis_ok"); say("MIA", k.c.success_line || "That did it."); apply(k.c.success_effects); }
  else { stat("crises_failed"); sfx("crisis_fail"); say("MIA", i < 0 ? (k.c.timeout_line || "Ground? ...I handled it myself. Barely.") : (k.c.fail_line || "That made it worse.")); apply(k.c.fail_effects); }
  emit("crisis_resolved", { id: k.id, success: ok });
  const inner = $("#crisisInner"); inner.innerHTML = `<div class="ct" style="color:${ok ? "var(--stamp-green)" : "var(--stamp-red)"}">${ok ? "RESOLVED" : "FAILED"}</div>`;
  setTimeout(() => { if (!S.crisis) $("#crisis").hidden = true; }, 1300);
}

  $("#o2b").style.width = S.o2 + "%"; $("#pwb").style.width = S.pw + "%";
  if (S.crisis) { const b = $("#cBar"); if (b) b.style.width = clamp(S.crisis.left / S.crisis.total * 100, 0, 100) + "%"; }
  if (station === "monitors") { document.querySelectorAll(".lsb").forEach(b => { const v = { O2: S.o2, PWR: S.pw, TMP: S.temp / .3 }[b.dataset.k]; b.style.width = clamp(v, 0, 100) + "%"; }); document.querySelectorAll(".lsv").forEach(s => s.textContent = { O2: (S.o2 | 0) + "%", PWR: (S.pw | 0) + "%", TMP: (S.temp | 0) + "C" }[s.dataset.k]); drawMap(); drawCam(); }
}

// ------------------------------------------------------------------ main loop
let last = performance.now(), hudAcc = 0, tabSig = "";
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  if (S && S.inGame && !paused) update(dt);
  if (subTimer > 0) { subTimer -= dt; if (subTimer <= 0) $("#sub").textContent = ""; }
  if (!$("#ending").hidden && endingEra) drawConsole($("#endScene").getContext("2d"), t, endingEra);
  else if ($("#menu").hidden) { (DRAW[station] || drawConsole)(g, t, day().era); }
  else drawConsole($("#menuBg").getContext("2d"), t, "1970s");
  hudAcc += dt;
  if (hudAcc > .25) { hudAcc = 0; hud(); const sig = STATIONS.map(([id]) => +pendingFor(id)).join("") + station; if (sig !== tabSig) { tabSig = sig; renderTabs(); } }
  if (dirty && S) { dirty = false; renderPanel(); renderTabs(); hud(); }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ swipe between stations
let sx = null;
$("#sceneWrap").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("#sceneWrap").addEventListener("touchend", e => { if (sx == null || !S) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) < 40) return; const i = STATIONS.findIndex(s => s[0] === station); const j = clamp(i + (dx > 0 ? -1 : 1), 0, STATIONS.length - 1); go(STATIONS[j][0]); });
document.addEventListener("keydown", e => {
  if (!S || !S.inGame) return;
  if (S.crisis && ["1", "2", "3"].includes(e.key)) { resolveCrisis(+e.key - 1); return; }
  const i = STATIONS.findIndex(s => s[0] === station);
  if (e.key === "a" || e.key === "ArrowLeft") go(STATIONS[Math.max(0, i - 1)][0]);
  if (e.key === "d" || e.key === "ArrowRight") go(STATIONS[Math.min(4, i + 1)][0]);
});

// ------------------------------------------------------------------ menu, pause, settings, achievements
function openMenu() {
  paused = true; setHum(false); hideLayer(); $("#menu").hidden = false;
  const sv = store.get("gc_save", null); $("#bCont").disabled = !sv; $("#bCont").textContent = sv ? `CONTINUE (SHIFT ${sv.day + 1})` : "CONTINUE";
}
function showAch(back) {
  showLayer(`<div class="h">Achievements ${Object.keys(unlocked).filter(k => ACH.some(a => a.id === k)).length} / ${ACH.length}</div>` +
    ACH.map(a => `<div class="ach ${unlocked[a.id] ? "on" : ""}"><div class="ic">${unlocked[a.id] ? esc(a.icon) : "??"}</div><div><div class="n">${esc(a.title)}</div><div>${esc(a.description)}</div></div></div>`).join("") + `<button id="lBack">BACK</button>`, null);
  $("#lBack").onclick = () => { sfx("ui_click"); back(); };
}
function showSettings(back) {
  const row = (k, n) => `<button class="chk" data-set="${k}"><span>${n}</span><span>${settings[k] ? "[ON]" : "[OFF]"}</span></button>`;
  showLayer(`<div class="h">Settings</div>${row("sound", "SOUND")}${row("crt", "CRT SCANLINES")}<button id="lReset">RESET ACHIEVEMENTS</button><button id="lBack">BACK</button>`, null);
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { settings[b.dataset.set] = !settings[b.dataset.set]; store.set("gc_settings", settings); applySettings(); sfx("switch"); showSettings(back); });
  $("#lReset").onclick = () => { if ($("#lReset").dataset.arm) { unlocked = {}; store.set("gc_ach", unlocked); $("#lReset").textContent = "ACHIEVEMENTS CLEARED"; } else { $("#lReset").dataset.arm = 1; $("#lReset").textContent = "TAP AGAIN TO CONFIRM"; } };
  $("#lBack").onclick = () => { sfx("ui_click"); back(); };
}
function applySettings() { $("#app").classList.toggle("crt", settings.crt); if (!settings.sound) setHum(false); else if (S?.inGame && !paused) setHum(true); }
function pauseMenu() {
  if (!S || !S.inGame) return; paused = true; setHum(false); $("#crisis").hidden = true;
  showLayer(`<div class="title" style="font-size:22px">PAUSED</div><button id="pRes">RESUME</button><button id="pAch">ACHIEVEMENTS</button><button id="pSet">SETTINGS</button><button id="pQuit">QUIT TO MENU</button><div class="muted">Progress is saved at the start of every shift.</div>`, null);
  $("#pRes").onclick = () => { sfx("ui_click"); hideLayer(); paused = false; setHum(true); if (S.crisis) $("#crisis").hidden = false; };
  $("#pAch").onclick = () => showAch(pauseMenu); $("#pSet").onclick = () => showSettings(pauseMenu);
  $("#pQuit").onclick = () => { sfx("ui_click"); S.inGame = false; $("#crisis").hidden = true; openMenu(); };
}
$("#pauseBtn").onclick = () => { sfx("ui_click"); pauseMenu(); };
$("#bNew").onclick = () => { audio(); sfx("ui_click"); if (store.get("gc_save", null) && !$("#bNew").dataset.arm) { $("#bNew").dataset.arm = 1; $("#bNew").textContent = "TAP AGAIN — PROGRESS WILL RESET"; return; } delete $("#bNew").dataset.arm; $("#bNew").textContent = "NEW GAME"; newGame(); };
$("#bCont").onclick = () => { audio(); sfx("ui_click"); const sv = store.get("gc_save", null); if (!sv) return; loadSnap(sv); startDay(); };
$("#bAch").onclick = () => { sfx("ui_click"); $("#menu").hidden = true; showAch(() => { hideLayer(); openMenu(); }); };
$("#bSet").onclick = () => { audio(); sfx("ui_click"); $("#menu").hidden = true; showSettings(() => { hideLayer(); openMenu(); }); };
document.addEventListener("visibilitychange", () => { if (document.hidden && S?.inGame && !paused) pauseMenu(); });

S = freshState(); applySettings(); openMenu(); requestAnimationFrame(frame);
</script>
